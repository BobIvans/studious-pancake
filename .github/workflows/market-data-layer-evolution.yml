name: MEGA Market Data Layer Evolution

on:
  pull_request:
    paths:
      - "src/market_data_evolution/**"
      - "config/market_data_evolution.json"
      - "docs/roadmap/market-data-layer-evolution-mega.md"
      - "release_artifacts/market_data_evolution/**"
      - "tests/market_data_evolution/**"
      - "scripts/verify_market_data_evolution.py"
      - "scripts/verify_repo.py"
      - ".github/workflows/market-data-layer-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile MEGA market-data surfaces
        run: >-
          python -m compileall -q
          src/market_data_evolution
          scripts/verify_market_data_evolution.py
          tests/market_data_evolution
      - name: Structural verifier
        run: python scripts/verify_market_data_evolution.py --json
      - name: Focused regressions
        run: >-
          python -m pytest -q
          tests/market_data_evolution/test_market_data_evolution.py
          tests/test_agg10_intelligence.py
          tests/mechanism_discovery/test_pr355_completion.py
          --disable-socket --allow-unix-socket
      - name: Predecessor PR-354 and PR-355 gates
        run: |
          python scripts/verify_pr354_mechanism_discovery.py --json
          python scripts/verify_pr355.py --json
      - name: Default-off assertion
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("config/market_data_evolution.json", encoding="utf-8"))
          assert not any(payload["effect_boundary"].values())
          assert all(row["execution_right"] is False for row in payload["experiments"])
          assert all(row["external_fetch_performed"] is False for row in payload["sources"])
          print("MDE_DEFAULT_OFF_OK")
          PY
