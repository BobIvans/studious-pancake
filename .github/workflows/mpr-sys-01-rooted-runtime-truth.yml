name: MPR-SYS-01 rooted runtime truth

on:
  pull_request:
    paths:
      - "src/config/chain_registry.py"
      - "src/resources/chain_registry.json"
      - "config/chain_registry.json"
      - "src/rooted_truth/**"
      - "src/asset_mint_registry_pr117.py"
      - "config/mpr_sys_01_identity_consumers.json"
      - "src/resources/rooted_runtime_truth_policy.json"
      - "src/resources/schema_registry.json"
      - "scripts/verify_mpr_sys_01_rooted_truth.py"
      - "tests/rooted_truth/**"
      - ".github/workflows/mpr-sys-01-rooted-runtime-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rooted-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .

      - name: Compile rooted-truth surface
        run: |
          python -m compileall -q \
            src/rooted_truth \
            src/config/chain_registry.py \
            scripts/verify_mpr_sys_01_rooted_truth.py \
            tests/rooted_truth

      - name: Check formatting
        run: |
          python -m black --check --diff \
            src/rooted_truth \
            scripts/verify_mpr_sys_01_rooted_truth.py \
            tests/rooted_truth

      - name: Run rooted-truth tests
        env:
          PAPER_TRADING_ONLY: "true"
          LIVE_TRADING_ENABLED: "false"
          JITO_ENABLED: "false"
        run: |
          python -m pytest \
            tests/rooted_truth \
            tests/test_pr117_asset_mint_registry.py \
            -q --disable-socket --allow-unix-socket

      - name: Materialize rooted-truth evidence
        run: python scripts/verify_mpr_sys_01_rooted_truth.py --json
