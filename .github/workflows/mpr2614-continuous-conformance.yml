name: MPR-2614 Continuous Conformance

on:
  pull_request:
    paths:
      - "src/operations/mpr2614_continuous_conformance.py"
      - "tests/test_mpr2614_continuous_conformance.py"
      - "docs/mpr2614/**"
      - ".github/workflows/mpr2614-continuous-conformance.yml"

permissions:
  contents: read

jobs:
  continuous-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q tests/test_mpr2614_continuous_conformance.py
      - run: python -m compileall -q src/operations/mpr2614_continuous_conformance.py tests/test_mpr2614_continuous_conformance.py
      - name: Verify sender-free import boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/operations/mpr2614_continuous_conformance.py").read_text(encoding="utf-8")
          forbidden = (
              "execution.senders",
              "isolated_signer_service",
              "sendTransaction",
              "sendRawTransaction",
              "sendBundle",
          )
          found = [value for value in forbidden if value in source]
          if found:
              raise SystemExit(f"forbidden MPR-2614 capability references: {found}")
          print("MPR2614_SENDER_FREE_IMPORT_BOUNDARY_OK")
          PY
