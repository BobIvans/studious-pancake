name: MPR-4X-01 architecture foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/runtime_authority*.py"
      - "src/runtime/runtime_entrypoint.py"
      - "src/durability/**"
      - "src/economics/durable_reservations.py"
      - "src/resources/runtime_authority.json"
      - "tests/test_mpr2601*.py"
      - "scripts/verify_mpr_4x_02_runtime_authority.py"
      - "src/contracts/**"
      - "src/config/canonical.py"
      - "src/policy_governance_pr143.py"
      - "src/release/identity.py"
      - "src/resources/schema_registry.json"
      - "src/resources/architecture_reachability.json"
      - "src/resources/production_surface_manifest.json"
      - "scripts/verify_mpr_4x_01_foundation.py"
      - "scripts/verify_repo.py"
      - "tests/architecture/test_mpr_4x_01_foundation.py"
      - ".github/workflows/mpr-4x-01-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    env:
      PAPER_TRADING_ONLY: "true"
      LIVE_TRADING_ENABLED: "false"
      JITO_ENABLED: "false"
      KAMINO_LIQUIDATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --quiet --requirement requirements.txt
      - run: python -m pip install --quiet --requirement requirements-dev.txt
      - run: python -m pip install --quiet --no-deps .
      - name: Compile foundation
        run: |
          python -m py_compile \
            src/contracts/__init__.py \
            src/contracts/registry.py \
            src/contracts/reachability.py \
            src/config/canonical.py \
            src/policy_governance_pr143.py \
            src/release/identity.py \
            scripts/verify_mpr_4x_01_foundation.py \
            tests/architecture/test_mpr_4x_01_foundation.py
      - name: Black formatting
        run: |
          python -m black --diff --check \
            src/contracts/__init__.py \
            src/contracts/registry.py \
            src/contracts/reachability.py \
            src/config/canonical.py \
            src/policy_governance_pr143.py \
            src/release/identity.py \
            scripts/verify_mpr_4x_01_foundation.py \
            tests/architecture/test_mpr_4x_01_foundation.py
      - name: Focused architecture and release tests
        run: |
          python -m pytest -q \
            tests/architecture/test_mpr_4x_01_foundation.py \
            tests/architecture/test_mpr_td_01_closure.py \
            tests/release/test_mpr_td_04_release.py \
            tests/test_pr143_policy_governance.py \
            --disable-socket --allow-unix-socket
      - name: Materialize foundation evidence
        run: python scripts/verify_mpr_4x_01_foundation.py --json
      - name: Runtime authority and durable reservation regressions
        run: python scripts/verify_mpr_4x_02_runtime_authority.py
      - name: Reproduce pre-fix two-connection capital race
        run: |
          git fetch --depth=1 origin 7c76d53bbed85b429b5d615d19496b7b72db6961
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          source = Path.cwd()
          with tempfile.TemporaryDirectory() as directory:
              baseline = Path(directory)
              archive = baseline / 'baseline.tar'
              subprocess.run(['git', 'archive', '--format=tar',
                              '--output', str(archive),
                              '7c76d53bbed85b429b5d615d19496b7b72db6961'], check=True)
              subprocess.run(['tar', '-xf', str(archive), '-C', str(baseline)], check=True)
              shutil.copyfile(source / 'tests/__init__.py', baseline / 'tests/__init__.py')
              shutil.copyfile(source / 'tests/test_mpr2601_durable_atomicity.py',
                              baseline / 'tests/test_mpr2601_durable_atomicity.py')
              result = subprocess.run([
                  sys.executable, '-m', 'pytest', '-q', '--disable-socket',
                  '--allow-unix-socket',
                  'tests/test_mpr2601_durable_atomicity.py::test_two_connections_cannot_both_spend_same_balance',
              ], cwd=baseline, capture_output=True, text=True, timeout=60)
              print(result.stdout)
              print(result.stderr)
              if result.returncode != 1 or 'assert 2 == 1' not in result.stdout:
                  raise SystemExit('Baseline did not reproduce the expected double admission')
              print('BASELINE_REPRODUCED: two admitted; current-head regression above requires one')
          PY
      - name: Build and inspect wheel
        run: |
          rm -rf dist build
          python -m build --wheel --no-isolation --outdir dist
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "src/contracts/__init__.py",
              "src/contracts/registry.py",
              "src/contracts/reachability.py",
              "src/config/canonical.py",
              "src/policy_governance_pr143.py",
              "src/release/identity.py",
              "src/resources/schema_registry.json",
              "src/resources/architecture_reachability.json",
          }
          with zipfile.ZipFile(wheel) as archive:
              members = set(archive.namelist())
          missing = sorted(required - members)
          if missing:
              raise SystemExit(f"missing MPR-4X-01 wheel members: {missing}")
          PY
