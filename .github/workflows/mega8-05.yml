name: MEGA8-05 autonomous R&D

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/research/mega8_05/**"
      - "tests/test_mega8_05_research_factory.py"
      - "scripts/verify_mega8_05.py"
      - "release_artifacts/mega8/MEGA8-05/**"
      - "docs/mega8/MEGA8-05.md"
      - ".github/workflows/mega8-05.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mega8-05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mega8-05:
    name: MEGA8-05 research factory
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"

      - name: Install runtime and dev requirements
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Install package
        run: python -m pip install . --no-deps

      - name: Compile MEGA8-05
        run: |
          python -m compileall -q src/research/mega8_05
          python -m compileall -q scripts/verify_mega8_05.py
          python -m compileall -q tests/test_mega8_05_research_factory.py

      - name: Black
        run: |
          python -m black --check \
            src/research/mega8_05 \
            scripts/verify_mega8_05.py \
            tests/test_mega8_05_research_factory.py

      - name: Verify structural closure
        run: python scripts/verify_mega8_05.py --json

      - name: Focused regressions
        run: |
          python -m pytest tests/test_mega8_05_research_factory.py \
            -q --disable-socket --allow-unix-socket

      - name: Installed-package smoke outside checkout
        run: |
          cd /tmp
          python - <<'PY'
          import inspect
          import src.research.mega8_05 as mega

          functions = [
              value
              for name, value in vars(mega).items()
              if inspect.isfunction(value) and not name.startswith("_")
          ]
          assert len(functions) == 64
          print("MEGA8-05 installed import: OK")
          PY
