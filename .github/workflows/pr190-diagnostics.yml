name: PR-190 diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pr190-diagnostics.yml
      - scripts/verify_repo.py

permissions:
  contents: read

jobs:
  capture-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Capture repository verification
        shell: bash
        run: |
          set +e
          python scripts/verify_repo.py > /tmp/pr190-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> /tmp/pr190-diagnostics.txt
          cat /tmp/pr190-diagnostics.txt
          exit 0
