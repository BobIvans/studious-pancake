name: MEGA8-01 continuous truth and reproducible data

on:
  pull_request:
    paths:
      - "src/mega8_01/**"
      - "scripts/verify_mega8_01.py"
      - "tests/test_mega8_01.py"
      - "config/mega8_01_coverage.json"
      - ".github/workflows/mega8-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mega8-01:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test tooling and editable package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3
          python -m pip install -e . --no-deps
      - name: Compile MEGA8-01 surface
        run: python -m compileall -q src/mega8_01 scripts/verify_mega8_01.py tests/test_mega8_01.py
      - name: Verify ownership and safety boundaries
        run: python scripts/verify_mega8_01.py --json
      - name: Run focused negative and replay tests
        run: python -m pytest -q tests/test_mega8_01.py
      - name: Installed-package smoke
        run: |
          cd /tmp
          python - <<'PY'
          import src.mega8_01 as mega
          assert len(mega.NF_SYMBOLS) == 48
          assert not any(mega.SAFETY_INVARIANTS.values())
          print("installed MEGA8-01 smoke passed")
          PY
