name: PR-2 lock refresh

on:
  push:
    branches:
      - codex/pr-2-human-intervention-closure
  pull_request:

concurrency:
  group: pr2-lock-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/pr-2-human-intervention-closure
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - run: python -m pip install pip-tools==7.5.2
      - name: Regenerate hashed locks
        run: |
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.lock --strip-extras requirements.txt
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements-dev.lock --strip-extras requirements-dev.txt
      - name: Refresh lock manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          path = root / "config/requirements-lock.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          for name in (
              "requirements.txt",
              "requirements-dev.txt",
              "requirements-analytics.txt",
          ):
              data["locks"][name]["sha256"] = hashlib.sha256(
                  (root / name).read_bytes()
              ).hexdigest()
          for name in ("requirements.lock", "requirements-dev.lock"):
              data["resolved_locks"][name]["sha256"] = hashlib.sha256(
                  (root / name).read_bytes()
              ).hexdigest()
          data["resolver"] = {"name": "pip-tools", "version": "7.5.2"}
          path.write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock config/requirements-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR-2: refresh vulnerable dependency locks"
          git push origin HEAD:codex/pr-2-human-intervention-closure
