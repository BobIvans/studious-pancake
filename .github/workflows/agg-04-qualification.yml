name: AGG-04 exact paper qualification

on:
  pull_request:
    paths:
      - "src/production_qualification.py"
      - "config/agg04_qualification_coverage.json"
      - "tests/test_agg04_qualification.py"
      - "docs/agg/AGG-04.md"
      - ".github/workflows/agg-04-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Compile AGG-04 surfaces
        run: >-
          python -m compileall -q
          src/production_qualification.py
          tests/test_agg04_qualification.py
          tests/test_mpr2611_production_qualification.py
      - name: Run AGG-04 and qualification-owner regressions
        run: >-
          python -m pytest -q
          tests/test_agg04_qualification.py
          tests/test_mpr2611_production_qualification.py
      - name: Validate exact primary NF coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/agg04_qualification_coverage.json").read_text())
          rows = p["primary_nf"]
          ids = [row["id"] for row in rows]
          assert p["agg_id"] == "AGG-04"
          assert len(rows) == 41
          assert len(set(ids)) == 41
          assert p["live_enabled"] is False
          assert p["release_claim_allowed"] is False
          assert p["production_ready"] is False
          print("AGG-04 coverage:", len(rows), "primary NF")
          PY
