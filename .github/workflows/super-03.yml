name: SUPER-03 venue qualification and solvers

on:
  pull_request:
    paths:
      - "src/direct_venue/super03.py"
      - "tests/test_super03_venue_qualification.py"
      - "config/super03_coverage.json"
      - "docs/roadmap/super-03.md"
      - ".github/workflows/super-03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  super-03:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed SUPER-03 imports
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.direct_venue.super03
          import src.production_qualification
          import src.strategy.conflict_scheduler
          import src.strategy.multihop_solver
          import src.economics.split_flow
          print("installed SUPER-03 owner imports: ok")
          PY
      - name: Compile SUPER-03 surfaces
        run: >-
          python -m compileall -q
          src/direct_venue/super03.py
          tests/test_super03_venue_qualification.py
      - name: Format SUPER-03 surfaces
        run: >-
          python -m black --check
          src/direct_venue/super03.py
          tests/test_super03_venue_qualification.py
      - name: Focused SUPER-03 and owner regressions
        run: >-
          python -m pytest -q
          tests/test_super03_venue_qualification.py
          tests/test_mpr2617_direct_venue_capability.py
          tests/test_agg04_qualification.py
          tests/test_agg05_conflict_scheduler.py
          tests/test_agg05_multihop_solver.py
          tests/test_agg05_split_flow.py
          --disable-socket --allow-unix-socket
      - name: Verify coverage is default-off and complete by child
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/super03_coverage.json").read_text())
          assert p["super_id"] == "SUPER-03"
          assert p["packages"] == ["W2-06", "W2-07", "W2-08"]
          assert len(p["source_prs"]) == 10
          assert len(p["children"]) == 10
          assert p["live_enabled"] is False
          assert p["release_claim_allowed"] is False
          assert p["production_ready"] is False
          assert p["operational_status"] == "BLOCKED_EXTERNAL"
          print("SUPER-03 coverage/default-off evidence: ok")
          PY
