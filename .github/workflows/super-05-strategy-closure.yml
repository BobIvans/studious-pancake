name: SUPER-05 strategy closure

on:
  pull_request:
    paths:
      - "src/super05_strategy_closure.py"
      - "tests/test_super05_strategy_closure.py"
      - "scripts/verify_super05_strategy_closure.py"
      - "scripts/verify_repo.py"
      - "docs/super/SUPER-05.md"
      - "release_artifacts/super/SUPER-05/coverage.json"
      - "src/agg06_solana_venues.py"
      - "src/liquidation/agg07.py"
      - "src/lending/agg07.py"
      - "src/decision/agg10.py"
  push:
    branches: [main]
    paths:
      - "src/super05_strategy_closure.py"
      - "tests/test_super05_strategy_closure.py"
      - "scripts/verify_super05_strategy_closure.py"

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  closure:
    name: SUPER-05 offline closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: python -m compileall -q src/super05_strategy_closure.py scripts/verify_super05_strategy_closure.py tests/test_super05_strategy_closure.py
      - run: python -m black --check src/super05_strategy_closure.py scripts/verify_super05_strategy_closure.py tests/test_super05_strategy_closure.py
      - run: python scripts/verify_super05_strategy_closure.py
      - run: >-
          python -m pytest -q
          tests/test_super05_strategy_closure.py
          tests/test_agg06_solana_venues.py
          tests/test_agg07_liquidation.py
          tests/lending/test_agg07_lending.py
          tests/test_agg10_intelligence.py
          tests/test_orderbook_quote_engine.py
          tests/test_mpr2621_lst_atomic_exit.py
          --disable-socket
          --allow-unix-socket
