name: PR-355 Evidence-Native Mechanism OS

on:
  pull_request:
    paths:
      - "src/mechanism_discovery/**"
      - "src/strategy_evolution/residual_discovery.py"
      - "tests/mechanism_discovery/test_pr355_evidence_native.py"
      - "scripts/verify_pr355.py"
      - "config/pr355_*.json"
      - "docs/roadmap/pr355-*"
      - "release_artifacts/pr355/**"
      - "scripts/verify_repo.py"
      - ".github/workflows/pr355-evidence-native-mechanism-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr355:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile PR-355 surfaces
        run: >-
          python -m compileall -q
          src/mechanism_discovery
          src/strategy_evolution/residual_discovery.py
          scripts/verify_pr355.py
          tests/mechanism_discovery/test_pr355_evidence_native.py
      - name: PR-355 structural verifier
        run: python scripts/verify_pr355.py --json
      - name: PR-355 focused tests
        run: >-
          python -m pytest -q
          tests/mechanism_discovery/test_pr355_evidence_native.py
          tests/mechanism_discovery/test_pr354_mechanism_discovery.py
          tests/strategy_evolution/test_pr353_strategy_evolution.py
          --disable-socket --allow-unix-socket
      - name: Predecessor structural gates
        run: |
          python scripts/verify_pr353_strategy_evolution.py --json
          python scripts/verify_pr354_mechanism_discovery.py --json
      - name: Assert default-off research boundary
        run: |
          python - <<'PY'
          import json
          packs = json.load(open("config/pr355_marketpacks.json", encoding="utf-8"))
          assert len(packs["packages"]) == 9
          assert all(row["state"] == "DISABLED" for row in packs["packages"].values())
          assert all(row["live"] is False for row in packs["packages"].values())
          assert not any(packs["effect_boundary"].values())
          assert packs["marginfi"] == "PAUSED"
          assert packs["slumlord_low_capital_requirement"] == "REQUIRED"
          print("PR355_DEFAULT_OFF_OK")
          PY
