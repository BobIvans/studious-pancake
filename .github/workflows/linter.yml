name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -q --requirement requirements.txt
      - run: python -m pip install -q --requirement requirements-dev.txt
      - run: python -m pip install -q --no-deps .
      - name: Find first offline failure
        shell: bash
        run: |
          set +e
          python -m pytest -m "not live and not manual" --disable-socket --allow-unix-socket -q -x --tb=short > /tmp/pytest.log 2>&1
          status=$?
          tail -n 180 /tmp/pytest.log
          exit "$status"
