name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Test capability matrix paths
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_capability_matrix_is_machine_readable_and_paths_exist -q --disable-socket --allow-unix-socket
      - name: Test strategy registry parity
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_capability_matrix_matches_strategy_registry_exactly -q --disable-socket --allow-unix-socket
      - name: Test quarantine modes
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_quarantined_components_are_disabled_only -q --disable-socket --allow-unix-socket
      - name: Test fixture strategy denial
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_fixture_or_disabled_strategy_cannot_be_enabled_by_config_flag -q --disable-socket --allow-unix-socket
      - name: Test canonical help
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_default_source_alias_routes_to_canonical_help -q --disable-socket --allow-unix-socket
      - name: Test status capabilities JSON
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_status_and_capabilities_json_are_stable -q --disable-socket --allow-unix-socket
      - name: Test paper service and live denial
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_installed_paper_service_blocks_without_provider_evidence_and_live_fails_closed -q --disable-socket --allow-unix-socket
      - name: Test quarantined imports
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_supported_composition_root_does_not_import_quarantined_execution -q --disable-socket --allow-unix-socket
      - name: Test audit artifacts
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py::test_audit_snapshot_and_runtime_contract_are_present -q --disable-socket --allow-unix-socket

  package-smoke:
    name: Wheel and console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/package_smoke.py

  container-smoke:
    name: Non-root runtime image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/image_smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
