name: PR-357 Adaptive Strategy Intelligence OS

on:
  pull_request:
    paths:
      - "src/research/pr357_*.py"
      - "tests/research/test_pr357_adaptive_strategy_intelligence.py"
      - "scripts/verify_pr357*.py"
      - "config/pr357_*.json"
      - "docs/roadmap/pr357-*"
      - "release_artifacts/pr357/**"
      - "scripts/verify_repo.py"
      - "config/format_targets.txt"
      - ".github/workflows/pr357-adaptive-strategy-intelligence-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr357:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile PR-357 surfaces
        run: >-
          python -m compileall -q
          src/research/pr357_contracts.py
          src/research/pr357_core.py
          src/research/pr357_requirements.py
          src/research/pr357_integrated.py
          scripts/verify_pr357.py
          scripts/verify_pr357_replication.py
          tests/research/test_pr357_adaptive_strategy_intelligence.py
      - name: PR-357 format lint and focused type checks
        run: |
          python -m black src/research/pr357_contracts.py src/research/pr357_core.py src/research/pr357_requirements.py src/research/pr357_integrated.py scripts/verify_pr357.py scripts/verify_pr357_replication.py tests/research/test_pr357_adaptive_strategy_intelligence.py
          for f in src/research/pr357_core.py src/research/pr357_requirements.py scripts/verify_pr357.py tests/research/test_pr357_adaptive_strategy_intelligence.py; do
            echo "__PR357_BLACK_BEGIN__:$f"
            cat "$f"
            echo "__PR357_BLACK_END__:$f"
          done
          exit 1
          python -m flake8 src/research/pr357_contracts.py src/research/pr357_core.py src/research/pr357_requirements.py src/research/pr357_integrated.py scripts/verify_pr357.py scripts/verify_pr357_replication.py tests/research/test_pr357_adaptive_strategy_intelligence.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m mypy --config-file mypy.ini src/research/pr357_core.py src/research/pr357_integrated.py
      - name: PR-357 structural and semantic verifier
        run: python scripts/verify_pr357.py
      - name: PR-357 focused tests
        run: >-
          python -m pytest -q
          tests/research/test_pr357_adaptive_strategy_intelligence.py
          --disable-socket --allow-unix-socket
      - name: Predecessor regression gates
        run: |
          python scripts/verify_pr353_strategy_evolution.py --json
          python scripts/verify_pr353_semantic_conformance.py --json
          python scripts/verify_pr354_mechanism_discovery.py --json
          python scripts/verify_pr355.py --json
          python scripts/verify_pr356.py --json
          python scripts/verify_pr356_completion.py
          python scripts/verify_market_data_evolution.py --json
      - name: Canonical repository verifier
        run: python scripts/verify_repo.py --skip-dependency-audit

  replication:
    runs-on: ubuntu-latest
    needs: pr357
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install source package
        run: python -m pip install --no-deps .
      - name: Independent deterministic replay
        run: python scripts/verify_pr357_replication.py
