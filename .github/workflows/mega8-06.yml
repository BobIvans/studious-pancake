name: MEGA8-06 microstructure risk network

on:
  pull_request:
    paths:
      - "src/mega8_06/**"
      - "tests/test_mega8_06.py"
      - "scripts/verify_mega8_06.py"
      - "config/mega8_06_coverage.json"
      - "docs/roadmap/mega8-06.md"
      - ".github/workflows/mega8-06.yml"
  push:
    branches: [main]
    paths:
      - "src/mega8_06/**"
      - "tests/test_mega8_06.py"
      - "scripts/verify_mega8_06.py"
      - "config/mega8_06_coverage.json"

permissions:
  contents: read

jobs:
  mega8-06:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused tools and package
        run: |
          python -m pip install --disable-pip-version-check "black==26.3.1" "pytest==9.0.3"
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Compile
        run: python -m compileall -q src/mega8_06 scripts/verify_mega8_06.py tests/test_mega8_06.py
      - name: Black
        run: python -m black --check --diff src/mega8_06 scripts/verify_mega8_06.py tests/test_mega8_06.py
      - name: Structural verifier
        run: python scripts/verify_mega8_06.py --json
      - name: Focused tests
        run: python -m pytest -q tests/test_mega8_06.py
      - name: Installed-package smoke outside checkout
        run: |
          cd /tmp
          python - <<'PY'
          import src.mega8_06 as mega
          assert mega.FUNCTION_COUNT == 64
          assert mega.NF_IDS == tuple(range(705, 769))
          assert mega.ResearchResult.__dataclass_fields__["live_enabled"].default is False
          PY
