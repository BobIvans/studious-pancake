name: ULTIMATE-MEGA1 full-scope closure

on:
  pull_request:
    paths:
      - "src/ultimate_mega1/**"
      - "src/mega8_08/**"
      - "src/release_gate/ultimate_mega1_closure.py"
      - "tests/test_ultimate_mega1.py"
      - "scripts/verify_ultimate_mega1.py"
      - "release_artifacts/ultimate/ULTIMATE-MEGA1/**"
      - "release_artifacts/mega8/MEGA8-08/**"
      - ".github/workflows/ultimate-mega1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ultimate-mega1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed package import boundary
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.mega8_08
          import src.ultimate_mega1
          from src.release_gate.ultimate_mega1_closure import NF_TO_CLOSURE
          assert src.mega8_08.FUNCTION_COUNT == 64
          assert src.ultimate_mega1.FUNCTION_COUNT == 120
          assert len(NF_TO_CLOSURE) == 1016
          print("installed ULTIMATE-MEGA1 imports: ok")
          PY
      - name: Compile new and closure surfaces
        run: >-
          python -m compileall -q
          src/mega8_08
          src/ultimate_mega1
          src/release_gate/ultimate_mega1_closure.py
          scripts/verify_ultimate_mega1.py
          tests/test_ultimate_mega1.py
      - name: Verify ownership, closure partition, and default-off effects
        run: python scripts/verify_ultimate_mega1.py --json
      - name: Focused ULTIMATE and canonical predecessor regressions
        run: >-
          python -m pytest -q
          tests/test_ultimate_mega1.py
          tests/test_agg15_release_handoff.py
          --disable-socket --allow-unix-socket
      - name: Assert operational authority remains separate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          u = json.loads(Path("release_artifacts/ultimate/ULTIMATE-MEGA1/coverage.json").read_text())
          r = json.loads(Path("release_artifacts/mega8/MEGA8-08/coverage.json").read_text())
          for payload in (u, r):
              assert payload["production_ready"] is False
              assert payload["live_enabled"] is False
              assert payload["signer_access"] is False
              assert payload["submission_access"] is False
              assert payload["network_mutation"] is False
              assert payload["automatic_capital_increase"] is False
          assert u["marginfi_status"] == "PAUSED"
          assert u["slumlord_requirement"] == "REQUIRED_FOR_LOW_CAPITAL_PROFILE"
          print("default-off operational boundary: ok")
          PY
