name: FAST-Q1 v3 qualify and report

on:
  pull_request:
    paths:
      - "src/qualification_report.py"
      - "src/automation_cli_pr189.py"
      - "tests/test_fast_q1_qualification_report.py"
      - "scripts/verify_fast_q1_v3.py"
      - "scripts/verify_fast_q1_smoke.py"
      - "release_artifacts/fast_q1_v3/**"
      - "docs/qualification/FAST_Q1_V3_QUALIFY_AND_REPORT_RU.md"
      - "config/format_targets.txt"
      - "scripts/verify_repo.py"
      - ".github/workflows/fast-q1-v3-qualify-and-report.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src/qualification_report.py src/automation_cli_pr189.py scripts/verify_fast_q1_v3.py scripts/verify_fast_q1_smoke.py tests/test_fast_q1_qualification_report.py
      - name: Black
        run: python -m black --check src/qualification_report.py src/automation_cli_pr189.py scripts/verify_fast_q1_v3.py scripts/verify_fast_q1_smoke.py tests/test_fast_q1_qualification_report.py
      - name: Verify contract
        run: python scripts/verify_fast_q1_v3.py
      - name: Focused tests
        run: python -m pytest -q tests/test_fast_q1_qualification_report.py --disable-socket --allow-unix-socket
      - name: Installed smoke
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          output_root="$RUNNER_TEMP/fast-q1-runs"
          result_json="$RUNNER_TEMP/fast-q1-command.json"
          flashloan-checks qualify-and-report inspect \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-root "$output_root" \
            --request-id smoke \
            --expected-sha "$expected_sha" \
            --profile offline_sender_free \
            --timeout-seconds 30 > "$result_json"
          python scripts/verify_fast_q1_smoke.py "$result_json"
