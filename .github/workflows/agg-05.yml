name: AGG-05 parallel search

on:
  pull_request:
    paths:
      - "src/strategy/conflict_scheduler.py"
      - "src/strategy/multihop_solver.py"
      - "src/economics/split_flow.py"
      - "tests/test_agg05_*.py"
      - "docs/agg/agg-05.md"
      - ".github/workflows/agg-05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agg-05:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed AGG-05 imports
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.economics.split_flow
          import src.strategy.conflict_scheduler
          import src.strategy.multihop_solver
          print("installed AGG-05 imports: ok")
          PY
      - name: Compile AGG-05 surfaces
        run: >-
          python -m compileall -q
          src/strategy/conflict_scheduler.py
          src/strategy/multihop_solver.py
          src/economics/split_flow.py
          tests/test_agg05_conflict_scheduler.py
          tests/test_agg05_multihop_solver.py
          tests/test_agg05_split_flow.py
      - name: Format AGG-05 surfaces
        run: >-
          python -m black --check
          src/strategy/conflict_scheduler.py
          src/strategy/multihop_solver.py
          src/economics/split_flow.py
          tests/test_agg05_conflict_scheduler.py
          tests/test_agg05_multihop_solver.py
          tests/test_agg05_split_flow.py
      - name: Focused AGG-05 and owner regressions
        run: >-
          python -m pytest -q
          tests/test_agg05_conflict_scheduler.py
          tests/test_agg05_multihop_solver.py
          tests/test_agg05_split_flow.py
          tests/test_pr057_durable_capital_reservations.py
          tests/test_pr118_non_monotonic_sizing.py
          tests/test_mpr2602_durable_completion.py
          --disable-socket --allow-unix-socket
