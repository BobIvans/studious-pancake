name: MPR-32 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  black-artifact:
    name: Black formatted artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact Black
        run: python -m pip install --quiet black==26.3.1
      - name: Format MPR-32 files
        run: >-
          python -m black
          scripts/verify_mpr32_public_entrypoint_truth.py
          tests/test_mpr32_public_entrypoint_truth.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@v4
        with:
          name: mpr32-black-formatted
          path: |
            scripts/verify_mpr32_public_entrypoint_truth.py
            tests/test_mpr32_public_entrypoint_truth.py
          if-no-files-found: error
