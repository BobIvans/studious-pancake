name: PR558 one-shot Black formatter

on:
  push:
    branches:
      - codex/mega-fastq-occ-laya-clean-20261002

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/mega-fastq-occ-laya-clean-20261002
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install black==26.3.1
      - name: Format OCC files
        run: |
          python -m black \
            scripts/verify_occ_automation.py \
            tools/occ_automation/asr_cpu_experiment.py \
            tools/occ_automation/occ_local.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify_occ_automation.py \
            tools/occ_automation/asr_cpu_experiment.py \
            tools/occ_automation/occ_local.py
          git commit -m "Format OCC automation files"
          git push origin HEAD:codex/mega-fastq-occ-laya-clean-20261002
