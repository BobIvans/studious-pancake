name: MPR-NEXT-08 temporary Black formatter

on:
  pull_request:
    paths:
      - ".github/workflows/mpr-next-08-autoformat-temporary.yml"
      - "scripts/verify_mpr_next_08_jupiter_v2_contract.py"
      - "src/providers/conformance/mega_b2.py"
      - "tests/test_mpr_next_08_jupiter_v2_contract.py"
      - "tests/test_mega_pr_b2_provider_conformance.py"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'mpr-next-08-jupiter-v2-product-contract-cutover'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
      - name: Install exact Black
        run: python -m pip install --quiet black==26.3.1
      - name: Format MPR-NEXT-08 files
        run: >-
          python -m black
          scripts/verify_mpr_next_08_jupiter_v2_contract.py
          src/providers/conformance/mega_b2.py
          tests/test_mpr_next_08_jupiter_v2_contract.py
          tests/test_mega_pr_b2_provider_conformance.py
      - name: Commit exact formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify_mpr_next_08_jupiter_v2_contract.py \
            src/providers/conformance/mega_b2.py \
            tests/test_mpr_next_08_jupiter_v2_contract.py \
            tests/test_mega_pr_b2_provider_conformance.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(mpr-next-08): apply exact Black formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
