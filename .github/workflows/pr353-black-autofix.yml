name: PR-353 Black autofix

on:
  pull_request:
    paths:
      - "src/strategy_evolution/**"
      - "tests/strategy_evolution/**"
      - "scripts/verify_pr353_strategy_evolution.py"
      - ".github/workflows/pr353-black-autofix.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 531
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - run: python -m pip install black==26.3.1
      - name: Apply Black 26.3.1
        run: >-
          python -m black
          src/strategy_evolution
          scripts/verify_pr353_strategy_evolution.py
          tests/strategy_evolution
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "BobIvans"
          git config user.email "130351128+BobIvans@users.noreply.github.com"
          git add src/strategy_evolution scripts/verify_pr353_strategy_evolution.py tests/strategy_evolution
          git commit -m "PR-353: apply Black 26.3.1 formatting"
          git push origin "HEAD:${{ github.head_ref }}"
