name: MPR-42 exact economic settlement authority

on:
  pull_request:
    paths:
      - 'src/mpr42_exact_economic_settlement_authority.py'
      - 'scripts/verify_mpr42_exact_economic_settlement_authority.py'
      - 'tests/test_mpr42_exact_economic_settlement_authority.py'
      - 'docs/mpr42_exact_economic_settlement_authority.md'
      - '.github/workflows/mpr42-exact-economic-settlement-authority.yml'

permissions:
  contents: read

jobs:
  mpr42-exact-economic-settlement-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Compile MPR-42 boundary
        run: |
          python -m py_compile \
            src/mpr42_exact_economic_settlement_authority.py \
            scripts/verify_mpr42_exact_economic_settlement_authority.py \
            tests/test_mpr42_exact_economic_settlement_authority.py
      - name: Run strict verifier
        run: python scripts/verify_mpr42_exact_economic_settlement_authority.py --strict --json
      - name: Run focused tests
        run: python -m pytest -q tests/test_mpr42_exact_economic_settlement_authority.py
