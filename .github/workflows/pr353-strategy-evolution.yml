name: PR-353 strategy evolution

on:
  pull_request:
    paths:
      - "src/strategy_evolution/**"
      - "tests/strategy_evolution/**"
      - "scripts/verify_pr353_strategy_evolution.py"
      - "config/strategy_evolution.json"
      - "docs/roadmap/pr353_non_duplication.md"
      - "docs/strategy_evolution/**"
      - "release_artifacts/pr353/**"
      - ".github/workflows/pr353-strategy-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile PR-353 surfaces
        run: >-
          python -m compileall -q
          src/strategy_evolution
          scripts/verify_pr353_strategy_evolution.py
          tests/strategy_evolution
      - name: Check PR-353 formatting
        run: >-
          python -m black --diff --check
          src/strategy_evolution
          scripts/verify_pr353_strategy_evolution.py
          tests/strategy_evolution
      - name: Structural verifier
        run: python scripts/verify_pr353_strategy_evolution.py --json
      - name: Focused PR-353 tests
        run: >-
          python -m pytest -q
          tests/strategy_evolution
          --disable-socket
          --allow-unix-socket
      - name: Canonical intelligence owner regressions
        run: >-
          python -m pytest -q
          tests/test_agg10_intelligence.py
          tests/test_ultimate_mega1.py
          --disable-socket
          --allow-unix-socket
      - name: Assert default-off package config
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("config/strategy_evolution.json", encoding="utf-8"))
          assert len(payload["packages"]) == 9
          assert all(
              row["state"] == "DISABLED" and row["live"] is False
              for row in payload["packages"].values()
          )
          assert not any(payload["effect_boundary"].values())
          print("PR353_DEFAULT_OFF_OK")
          PY
