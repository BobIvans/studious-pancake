name: PR-358 Market Relation Science Exchange OS

on:
  pull_request:
    paths:
      - "src/research/pr358_*.py"
      - "tests/research/test_pr358_market_relation_exchange.py"
      - "tests/fixtures/pr358_relation_vertical.json"
      - "scripts/verify_pr358*.py"
      - "config/pr358_*.json"
      - "docs/roadmap/pr358-*"
      - "release_artifacts/pr358/**"
      - "scripts/verify_repo.py"
      - "config/format_targets.txt"
      - ".github/workflows/pr358-market-relation-science-exchange-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr358:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile PR-358 surfaces
        run: >-
          python -m compileall -q
          src/research/pr358_contracts.py
          src/research/pr358_core.py
          src/research/pr358_requirements.py
          src/research/pr358_integrated.py
          scripts/verify_pr358.py
          scripts/verify_pr358_replication.py
          tests/research/test_pr358_market_relation_exchange.py
      - name: PR-358 format lint and focused type checks
        run: |
          python -m black --diff --check src/research/pr358_contracts.py src/research/pr358_core.py src/research/pr358_requirements.py src/research/pr358_integrated.py scripts/verify_pr358.py scripts/verify_pr358_replication.py tests/research/test_pr358_market_relation_exchange.py
          python -m flake8 src/research/pr358_contracts.py src/research/pr358_core.py src/research/pr358_requirements.py src/research/pr358_integrated.py scripts/verify_pr358.py scripts/verify_pr358_replication.py tests/research/test_pr358_market_relation_exchange.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m mypy --config-file mypy.ini src/research/pr358_core.py src/research/pr358_integrated.py
      - name: PR-358 structural and semantic verifier
        run: python scripts/verify_pr358.py
      - name: PR-358 focused tests
        run: >-
          python -m pytest -q
          tests/research/test_pr358_market_relation_exchange.py
          --disable-socket --allow-unix-socket
      - name: Predecessor regression gates
        run: |
          python scripts/verify_pr353_strategy_evolution.py --json
          python scripts/verify_pr353_semantic_conformance.py --json
          python scripts/verify_pr354_mechanism_discovery.py --json
          python scripts/verify_pr355.py --json
          python scripts/verify_pr356.py --json
          python scripts/verify_pr356_completion.py
          python scripts/verify_pr357.py
          python scripts/verify_market_data_evolution.py --json
      - name: Static no-effect and no-network assertions
        run: |
          ! grep -R -n -E 'requests|httpx|aiohttp|socket|urllib|sign_and_send|send_raw_transaction|customer_billing[[:space:]]*=[[:space:]]*True|payment_sent[[:space:]]*=[[:space:]]*True' src/research/pr358_*.py
      - name: Canonical repository verifier
        run: python scripts/verify_repo.py --skip-dependency-audit

  replication:
    runs-on: ubuntu-latest
    needs: pr358
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and source package
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps .
      - name: Independent deterministic replay
        run: python scripts/verify_pr358_replication.py
