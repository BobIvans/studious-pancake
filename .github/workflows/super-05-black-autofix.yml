name: SUPER-05 Black autofix

on:
  push:
    branches:
      - "codex/super-05-strategy-vertical-closure"
    paths:
      - ".github/workflows/super-05-black-autofix.yml"
      - "src/super05_strategy_closure.py"
      - "tests/test_super05_strategy_closure.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - run: python -m pip install black==26.3.1
      - run: python -m black src/super05_strategy_closure.py tests/test_super05_strategy_closure.py
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/super05_strategy_closure.py tests/test_super05_strategy_closure.py
          if git diff --cached --quiet; then
            echo "Black already clean"
          else
            git commit -m "style: apply Black to SUPER-05"
            git push origin HEAD:codex/super-05-strategy-vertical-closure
          fi
