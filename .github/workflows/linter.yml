name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Offline tests 001-050
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '1,50p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 051-100
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '51,100p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 101-150
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '101,150p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 151-200
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '151,200p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 201-250
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '201,250p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 251-300
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '251,300p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 301-350
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '301,350p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 351-400
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '351,400p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 401-450
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '401,450p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 451-500
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '451,500p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 501-550
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '501,550p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 551+
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '551,$p')
          ((${#files[@]} == 0)) || python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q

  package-smoke:
    name: Wheel and console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/package_smoke.py

  container-smoke:
    name: Non-root runtime image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/image_smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
