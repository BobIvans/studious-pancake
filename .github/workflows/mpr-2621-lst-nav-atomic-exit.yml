name: MPR-2621 LST NAV atomic exit

on:
  pull_request:
    paths:
      - "src/mpr2621_lst_atomic_exit.py"
      - "scripts/verify_mpr2621_lst_atomic_exit.py"
      - "tests/test_mpr2621_lst_atomic_exit.py"
      - "docs/mpr2621/lst_nav_atomic_exit.md"
      - ".github/workflows/mpr-2621-lst-nav-atomic-exit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Compile sender-free authority
        run: >-
          python -m compileall -q
          src/mpr2621_lst_atomic_exit.py
          scripts/verify_mpr2621_lst_atomic_exit.py
          tests/test_mpr2621_lst_atomic_exit.py
      - name: Run T01-T30 regressions
        run: python -m pytest -q tests/test_mpr2621_lst_atomic_exit.py
      - name: Verify qualification boundary
        run: python scripts/verify_mpr2621_lst_atomic_exit.py
