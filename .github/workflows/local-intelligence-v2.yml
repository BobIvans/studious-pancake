name: Local intelligence and retention V2
on:
  pull_request:
    paths:
      - 'src/intelligence/**'
      - 'src/agg02/storage.py'
      - 'src/routing/transport.py'
      - 'src/market/native_cpmm_capture.py'
      - 'src/paper_shadow/native_cpmm_qualification.py'
      - 'src/paper_shadow/repeated_service_pr04.py'
      - 'src/paper_shadow/durable_service_a3.py'
      - 'src/runtime/core_v1_materializer.py'
      - 'src/runtime/runtime_entrypoint.py'
      - 'src/cli.py'
      - 'tests/test_pr04_repeated_installed_paper_service.py'
      - 'tests/test_pr02_unified_lifecycle_authority.py'
      - 'requirements*.lock'
      - 'pyproject.toml'
      - 'tests/intelligence/**'
      - 'scripts/verify_local_intelligence_v2.py'
      - '.github/workflows/local-intelligence-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m black --check src/intelligence tests/intelligence src/agg02/storage.py scripts/verify_local_intelligence_v2.py
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports src/intelligence
      - run: python -m pytest -q tests/intelligence tests/test_agg02_market_data_capital.py tests/test_agg04_qualification.py tests/test_mpr2611_production_qualification.py tests/market_data_evolution/test_market_data_evolution.py --disable-socket --allow-unix-socket
      - run: python -m pytest -q tests/test_native_cpmm_qualification.py tests/providers/test_pr004_transport_authority.py tests/routing/test_mpr2602_governed_transport.py tests/routing/test_mpr2602_transport_bounds.py --disable-socket --allow-unix-socket
      - run: python -m pytest -q tests/test_pr04_repeated_installed_paper_service.py tests/test_pr02_unified_lifecycle_authority.py tests/test_mpr2601_scope_workers.py --disable-socket --allow-unix-socket
      - run: python scripts/verify_local_intelligence_v2.py --out "$RUNNER_TEMP/local-intelligence-acceptance"
