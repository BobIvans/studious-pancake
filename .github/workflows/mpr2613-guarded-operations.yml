name: MPR-2613 Guarded Operations

on:
  pull_request:
    paths:
      - "src/operations/mpr2613_guarded_operations.py"
      - "src/operations/__init__.py"
      - "tests/test_mpr2613_guarded_operations.py"
      - "docs/mpr2613-*.md"
      - ".github/workflows/mpr2613-guarded-operations.yml"

permissions:
  contents: read

jobs:
  guarded-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q tests/test_mpr2613_guarded_operations.py
      - run: python -m compileall -q src/operations/mpr2613_guarded_operations.py
