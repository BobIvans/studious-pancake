name: MEGA8-03 Solana workers and safe intelligence

on:
  pull_request:
    paths:
      - "src/mega8_03/**"
      - "tests/test_mega8_03_*.py"
      - "config/mega8_03_coverage.json"
      - "docs/roadmap/mega8-03.md"
      - ".github/workflows/mega8-03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mega8-03:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed MEGA8-03 imports
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import importlib
          import pkgutil
          import src.mega8_03 as package
          modules = sorted(item.name for item in pkgutil.iter_modules(package.__path__))
          for name in modules:
              importlib.import_module(f"src.mega8_03.{name}")
          print("installed MEGA8-03 imports:", len(modules))
          PY
      - name: Compile MEGA8-03 surfaces
        run: >-
          python -m compileall -q
          src/mega8_03
          tests/test_mega8_03_solana.py
          tests/test_mega8_03_intelligence.py
          tests/test_mega8_03_coverage.py
      - name: Format MEGA8-03 surfaces
        run: >-
          python -m black --check
          src/mega8_03
          tests/test_mega8_03_solana.py
          tests/test_mega8_03_intelligence.py
          tests/test_mega8_03_coverage.py
      - name: MEGA8-03 focused tests
        run: >-
          python -m pytest -q
          tests/test_mega8_03_solana.py
          tests/test_mega8_03_intelligence.py
          tests/test_mega8_03_coverage.py
          --disable-socket --allow-unix-socket
      - name: Canonical owner regressions
        run: >-
          python -m pytest -q
          tests/test_agg04_qualification.py
          tests/test_agg07_liquidation.py
          tests/test_agg13_inventory_platform.py
          tests/test_agg14_research_system.py
          tests/execution/test_economic_reconciliation_pr037.py
          tests/test_decision_isolation.py
          tests/test_decision_leakage.py
          --disable-socket --allow-unix-socket
      - name: Verify exact scope and default-off boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/mega8_03_coverage.json").read_text())
          assert p["mega_id"] == "MEGA8-03"
          assert len(p["roadmap_children"]) == 23
          assert len(p["children"]) == 23
          assert p["nf_count"] == 92
          nf = [item for child in p["children"] for item in child["nf"]]
          assert nf == [f"NF-{i:03d}" for i in range(493, 585)]
          assert p["signing_enabled"] is False
          assert p["submission_enabled"] is False
          assert p["live_enabled"] is False
          assert p["automatic_capital_increase_allowed"] is False
          assert p["production_ready"] is False
          print("MEGA8-03 coverage/default-off boundary: ok")
          PY
