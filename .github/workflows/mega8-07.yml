name: MEGA8-07 performance distributed evidence and capital

on:
  pull_request:
    paths:
      - "src/mega8_07/**"
      - "tests/test_mega8_07_*.py"
      - "release_artifacts/mega8/MEGA8-07/**"
      - "docs/roadmap/mega8-07.md"
      - "scripts/verify_mega8_07.py"
      - ".github/workflows/mega8-07.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mega8-07:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed MEGA8-07 imports
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.mega8_07
          import src.mega8_07.pr271
          import src.mega8_07.pr278
          import src.mega8_07.pr286
          assert src.mega8_07.FUNCTION_COUNT == 64
          print("installed MEGA8-07 imports: ok")
          PY
      - name: Compile MEGA8-07 surfaces
        run: >-
          python -m compileall -q
          src/mega8_07
          scripts/verify_mega8_07.py
          tests/test_mega8_07_manifest.py
          tests/test_mega8_07_performance_data.py
          tests/test_mega8_07_capital_mechanisms.py
      - name: Format MEGA8-07 surfaces
        run: >-
          python -m black --diff --check
          src/mega8_07
          scripts/verify_mega8_07.py
          tests/test_mega8_07_manifest.py
          tests/test_mega8_07_performance_data.py
          tests/test_mega8_07_capital_mechanisms.py
      - name: Verify exact ownership and default-off boundary
        run: python scripts/verify_mega8_07.py --json
      - name: Focused MEGA8-07 and canonical owner regressions
        run: >-
          python -m pytest -q
          tests/test_mega8_07_manifest.py
          tests/test_mega8_07_performance_data.py
          tests/test_mega8_07_capital_mechanisms.py
          tests/test_pr032_capital_engine.py
          tests/lending/test_mpr2615_controlled_expansion.py
          tests/test_liquidation_planner.py
          --disable-socket --allow-unix-socket
      - name: Verify dependency truth remains blocked and default-off
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("release_artifacts/mega8/MEGA8-07/coverage.json").read_text())
          assert p["mega_id"] == "MEGA8-07"
          assert p["roadmap_children"] == list(range(271, 287))
          assert p["nf_range"] == [769, 832]
          assert p["implementation_status"] == "IMPLEMENTED_OFFLINE"
          assert p["operational_status"] == "BLOCKED_DEPENDENCIES"
          assert p["production_ready"] is False
          assert p["live_enabled"] is False
          assert p["signer_access"] is False
          assert p["submission_access"] is False
          assert p["network_mutation"] is False
          assert p["automatic_capital_increase"] is False
          print("MEGA8-07 dependency/default-off evidence: ok")
          PY
