name: MPR-043 verify diagnostics

on:
  push:
    branches:
      - mpr-043-dependency-entitlement-scheduler
    paths:
      - .github/workflows/mpr043-verify-diagnostics.yml
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-043-dependency-entitlement-scheduler
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install package
        run: python -m pip install --no-deps .

      - name: pip check
        id: pip_check
        continue-on-error: true
        run: python -m pip check
      - name: quality gate
        id: quality
        continue-on-error: true
        run: python scripts/quality_gate.py --with-dependency-audit
      - name: authority map
        id: authority
        continue-on-error: true
        run: python scripts/validate_authority_map.py
      - name: package smoke
        id: package_smoke
        continue-on-error: true
        run: python scripts/package_smoke.py
      - name: PR194 required controls
        id: pr194_controls
        continue-on-error: true
        run: python scripts/verify_pr194_required_controls.py
      - name: PR194 trusted foundation
        id: pr194_foundation
        continue-on-error: true
        run: python scripts/verify_pr194_trusted_foundation.py --json
      - name: MPR32 public entrypoint truth
        id: mpr32
        continue-on-error: true
        run: python scripts/verify_mpr32_public_entrypoint_truth.py --json
      - name: PR200 production cutover
        id: pr200
        continue-on-error: true
        run: python scripts/verify_pr200_production_cutover.py --json
      - name: PR206 durable state
        id: pr206
        continue-on-error: true
        run: python scripts/verify_pr206_durable_state.py --json
      - name: MPR-TD-01 canonical surface
        id: td01
        continue-on-error: true
        run: python scripts/verify_mpr_td_01_canonical_surface.py --json
      - name: MPR-TD-02 failure verification
        id: td02
        continue-on-error: true
        run: python scripts/verify_mpr_td_02_failure_verification.py --json
      - name: MPR-TD-03 capacity storage
        id: td03
        continue-on-error: true
        run: python scripts/verify_mpr_td_03_capacity_storage.py --json
      - name: MPR-TD-04 upgrade security
        id: td04
        continue-on-error: true
        run: python scripts/verify_mpr_td_04_upgrade_security.py --json
      - name: compileall
        id: compileall
        continue-on-error: true
        run: python -m compileall -q arb_bot.py src scripts tests
      - name: runtime status
        id: runtime_status
        continue-on-error: true
        run: python arb_bot.py status --json
      - name: runtime capabilities
        id: runtime_capabilities
        continue-on-error: true
        run: python arb_bot.py capabilities --json
      - name: focused mandatory tests
        id: focused_tests
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_pr01_authority_map.py
          tests/test_pr023_runtime_truth.py
          tests/test_launcher_startup_smoke.py
          tests/test_import_smoke.py
          tests/test_quality_quarantine.py
          tests/test_pr087_package_boundary.py
          tests/test_pr101_marginfi_complete_protocol_evidence.py
          tests/test_pr106_canonical_sender_lifecycle_disabled.py
          tests/test_pr115_simulation_owned_economic_proof.py
          tests/test_pr116_coherent_marginfi_snapshot_oracle.py
          tests/test_pr121_single_durable_lifecycle_truth.py
          tests/test_pr120_secret_resolver_config_jito.py
          tests/test_pr125_lst_governance_policy.py
          tests/test_pr136_rooted_rpc_quorum.py
          tests/test_pr140_data_lineage_quarantine.py
          tests/test_pr194_trusted_foundation.py
          tests/test_pr195_durable_webhook_intake.py
          tests/test_pr200_production_cutover.py
          tests/test_pr195_durable_kernel_v3.py
          tests/test_pr206_durable_state.py
          -q --disable-socket --allow-unix-socket
      - name: full offline tests
        id: full_tests
        continue-on-error: true
        run: python -m pytest -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: clean source tree
        id: clean_tree
        continue-on-error: true
        run: test -z "$(git status --porcelain)"

      - name: Fail on any diagnostic failure
        if: always()
        run: |
          python - <<'PY'
          import os
          failures = []
          for name in (
              "pip_check", "quality", "authority", "package_smoke",
              "pr194_controls", "pr194_foundation", "mpr32", "pr200", "pr206",
              "td01", "td02", "td03", "td04", "compileall", "runtime_status",
              "runtime_capabilities", "focused_tests", "full_tests", "clean_tree",
          ):
              outcome = os.environ.get(name.upper(), "")
              if outcome != "success":
                  failures.append(f"{name}={outcome}")
          if failures:
              raise SystemExit("diagnostic failures: " + ", ".join(failures))
          PY
        env:
          PIP_CHECK: ${{ steps.pip_check.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          AUTHORITY: ${{ steps.authority.outcome }}
          PACKAGE_SMOKE: ${{ steps.package_smoke.outcome }}
          PR194_CONTROLS: ${{ steps.pr194_controls.outcome }}
          PR194_FOUNDATION: ${{ steps.pr194_foundation.outcome }}
          MPR32: ${{ steps.mpr32.outcome }}
          PR200: ${{ steps.pr200.outcome }}
          PR206: ${{ steps.pr206.outcome }}
          TD01: ${{ steps.td01.outcome }}
          TD02: ${{ steps.td02.outcome }}
          TD03: ${{ steps.td03.outcome }}
          TD04: ${{ steps.td04.outcome }}
          COMPILEALL: ${{ steps.compileall.outcome }}
          RUNTIME_STATUS: ${{ steps.runtime_status.outcome }}
          RUNTIME_CAPABILITIES: ${{ steps.runtime_capabilities.outcome }}
          FOCUSED_TESTS: ${{ steps.focused_tests.outcome }}
          FULL_TESTS: ${{ steps.full_tests.outcome }}
          CLEAN_TREE: ${{ steps.clean_tree.outcome }}
