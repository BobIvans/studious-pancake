name: MPR-NEXT-01 product truth and release hygiene

on:
  pull_request:
    paths:
      - "src/mpr_next_01_product_truth_gate.py"
      - "src/resources/production_debt_closure_map.json"
      - "scripts/verify_mpr_next_01_product_truth.py"
      - "tests/test_mpr_next_01_product_truth_ci_release_hygiene.py"
      - ".github/workflows/mpr-next-01-product-truth-ci-release-hygiene.yml"
      - ".github/workflows/mpr31-final-promotion-gate.yml"
      - ".github/workflows/pr190-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-truth-release-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_TRADING_ONLY: "true"
      LIVE_TRADING_ENABLED: "false"
      JITO_ENABLED: "false"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2
      - name: Compile MPR-NEXT-01 surface
        run: |
          python -m py_compile \
            src/mpr_next_01_product_truth_gate.py \
            scripts/verify_mpr_next_01_product_truth.py \
            tests/test_mpr_next_01_product_truth_ci_release_hygiene.py
      - name: Run focused MPR-NEXT-01 tests
        run: python -m pytest -q tests/test_mpr_next_01_product_truth_ci_release_hygiene.py
      - name: Run focused product truth verifier
        run: python scripts/verify_mpr_next_01_product_truth.py --json > /tmp/mpr-next-01.json
      - name: Closure map JSON smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("src/resources/production_debt_closure_map.json").read_text()
          )
          if payload.get("live_enabled") is not False:
              raise SystemExit("closure map must keep live disabled")
          if payload.get("production_ready") is not False:
              raise SystemExit("closure map must not claim production readiness")
          policy = payload.get("policy", {})
          if policy.get("offline_validators_do_not_close_blockers") is not True:
              raise SystemExit("closure map must not close blockers with offline validators")
          if not payload.get("gates"):
              raise SystemExit("closure map must contain gates")
          PY
