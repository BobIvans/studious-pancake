name: MPR-2612 final release gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/release_gate/**"
      - "tests/test_mpr31_final_promotion_gate.py"
      - "tests/test_mpr2612_durable_release.py"
      - "docs/mpr2612/**"
      - ".github/workflows/mpr-2612-final-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpr-2612-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIVE_TRADING_ENABLED: "false"
  PAPER_TRADING_ONLY: "true"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: One-shot CI repair
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/release_gate/mpr31_final_promotion_gate.py")
          text = path.read_text()
          start = text.index("def _public_payload(value: object) -> dict[str, Any]:")
          end = text.index("\n\ndef _canonical_json", start)
          replacement = '''def _public_payload(value: object) -> dict[str, Any]:
              if not is_dataclass(value):
                  raise TypeError("expected dataclass payload")
              return {
                  field.name: _canonical_value(getattr(value, field.name))
                  for field in fields(value)
              }


          def _canonical_value(value: object) -> Any:
              if isinstance(value, StrEnum):
                  return value.value
              if is_dataclass(value):
                  return {
                      field.name: _canonical_value(getattr(value, field.name))
                      for field in fields(value)
                  }
              if isinstance(value, (tuple, list)):
                  return [_canonical_value(item) for item in value]
              if isinstance(value, dict):
                  return {
                      key: _canonical_value(item)
                      for key, item in value.items()
                  }
              return value'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python -m black \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
          if git diff --quiet -- \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
          git commit -m "fix(ci): canonicalize nested release payloads and format"
          git push origin "HEAD:${HEAD_REF}"
      - name: Compile final release surfaces
        run: |
          python -m compileall -q \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Format final release surfaces
        run: |
          python -m black --check --diff \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Adversarial and durable release regressions
        run: |
          python -m pytest -q \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Prove release stays default-off
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/release_gate/mpr31_final_promotion_gate.py').read_text()
          durable = Path('src/release_gate/mpr2612_durable_release.py').read_text()
          assert 'TARGET_PRODUCT_STATE = "production-ready-default-off"' in source
          assert 'live_enabled=False' in source
          assert 'automatic_scale_up_allowed=False' in source
          assert 'CHECK(live_enabled=0)' in durable
          assert 'CHECK(unrestricted_live_allowed=0)' in durable
          assert 'CHECK(automatic_scale_up_allowed=0)' in durable
          print('MPR-2612 default-off release contract present')
          PY
