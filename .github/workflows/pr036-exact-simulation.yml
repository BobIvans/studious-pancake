name: PR-036 exact simulation

on:
  pull_request:
    paths:
      - "src/execution/exact_simulation.py"
      - "src/execution/__init__.py"
      - "tests/execution/test_exact_simulation_pr036.py"
      - ".github/workflows/pr036-exact-simulation.yml"

permissions:
  contents: read

jobs:
  focused:
    name: PR-036 focused verification
    runs-on: ubuntu-latest
    env:
      PAPER_TRADING_ONLY: "true"
      LIVE_TRADING_ENABLED: "false"
      JITO_ENABLED: "false"
      KAMINO_LIQUIDATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Black
        run: python -m black --check src/execution/exact_simulation.py tests/execution/test_exact_simulation_pr036.py
      - name: Mypy
        run: python -m mypy --config-file mypy.ini src/execution/exact_simulation.py
      - name: Focused tests
        run: python -m pytest tests/execution/test_exact_simulation_pr036.py -q --disable-socket --allow-unix-socket
      - name: Compile
        run: python -m compileall -q src/execution tests/execution
