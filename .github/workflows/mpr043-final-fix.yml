name: MPR-043 final verification fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'mpr-043-dependency-entitlement-scheduler'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-043-dependency-entitlement-scheduler
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Apply reload-safe admission fix and verify repository
        shell: bash
        run: |
          set -euo pipefail
          python .mpr043-final/apply.py
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m black \
            src/provider_governance/models.py \
            src/provider_governance/dependency.py \
            src/routing/registry.py \
            tests/test_mpr043_provider_governance.py
          python -m mypy --config-file mypy.ini
          python -m pytest -q tests/test_mpr043_provider_governance.py
          python scripts/verify_repo.py
          rm -rf .mpr043-final .github/workflows/mpr043-final-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MPR-043: preserve dependency failure identity across reloads'
          git push origin HEAD:mpr-043-dependency-entitlement-scheduler
