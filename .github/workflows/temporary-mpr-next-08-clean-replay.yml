name: Temporary clean MPR-NEXT-08 replay

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-mpr-next-08-clean-replay.yml"

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'mpr-next-08-jupiter-v2-product-contract-cutover'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mpr-next-08-jupiter-v2-product-contract-cutover-v2
          fetch-depth: 0
      - name: Replay only MPR-NEXT-08 commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            main \
            mpr-next-08-jupiter-v2-product-contract-cutover \
            mpr-next-08-jupiter-v2-product-contract-cutover-v2

          mapfile -t commits < <(
            git log --reverse --format='%H%x09%s' \
              origin/main..origin/mpr-next-08-jupiter-v2-product-contract-cutover |
            awk -F '\t' '$2 ~ /^(feat|fix|test|ci|style)\(mpr-next-08\):/ {print $1}'
          )
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No MPR-NEXT-08 commits found." >&2
            exit 1
          fi
          printf 'Replaying %s commits:\n' "${#commits[@]}"
          printf '%s\n' "${commits[@]}"
          git cherry-pick "${commits[@]}"

          cat > /tmp/mpr-next-08-allowed-paths.txt <<'EOF'
          .github/workflows/mpr-next-08-jupiter-v2-contract.yml
          config/format_targets.txt
          config/jupiter_endpoint_quarantine.json
          scripts/verify_mpr_next_08_jupiter_v2_contract.py
          scripts/verify_repo.py
          src/providers/conformance/mega_b2.py
          tests/test_mega_pr_b2_provider_conformance.py
          tests/test_mpr_next_08_jupiter_v2_contract.py
          EOF
          sed -i 's/^          //' /tmp/mpr-next-08-allowed-paths.txt

          unexpected="$({
            git diff --name-only origin/main...HEAD |
              grep -vxFf /tmp/mpr-next-08-allowed-paths.txt
          } || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths in clean replay:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git push origin HEAD:mpr-next-08-jupiter-v2-product-contract-cutover-v2
