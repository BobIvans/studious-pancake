name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Prefix 051-052
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-053
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-054
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-055
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-056
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py tests/test_decision_split.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-057
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py tests/test_decision_split.py tests/test_import_smoke.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-058
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py tests/test_decision_split.py tests/test_import_smoke.py tests/test_jito_bundle_handler.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-059
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py tests/test_decision_split.py tests/test_import_smoke.py tests/test_jito_bundle_handler.py tests/test_launcher_startup_smoke.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Prefix 051-060
        run: python -m pytest tests/test_decision_dataset.py tests/test_decision_isolation.py tests/test_decision_leakage.py tests/test_decision_model.py tests/test_decision_quota_replay.py tests/test_decision_split.py tests/test_import_smoke.py tests/test_jito_bundle_handler.py tests/test_launcher_startup_smoke.py tests/test_liquidation_adapters.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
