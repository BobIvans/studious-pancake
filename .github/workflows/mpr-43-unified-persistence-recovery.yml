name: MPR-43 unified persistence recovery

on:
  pull_request:
    paths:
      - "src/durability/mpr43_unified_persistence.py"
      - "scripts/verify_mpr43_unified_persistence.py"
      - "tests/test_mpr43_unified_persistence.py"
      - "docs/roadmap/mpr_43_unified_persistence_recovery.md"
      - ".github/workflows/mpr-43-unified-persistence-recovery.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
      - name: Install focused test dependency
        run: python -m pip install pytest==9.0.2
      - name: Compile MPR-43 files
        run: |
          python -m py_compile \
            src/durability/mpr43_unified_persistence.py \
            scripts/verify_mpr43_unified_persistence.py \
            tests/test_mpr43_unified_persistence.py
      - name: Run focused MPR-43 tests
        run: PYTHONPATH=. python -m pytest -q tests/test_mpr43_unified_persistence.py
      - name: Run verifier
        run: PYTHONPATH=. python scripts/verify_mpr43_unified_persistence.py --json
