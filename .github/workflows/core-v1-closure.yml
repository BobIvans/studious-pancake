name: CORE-V1 closure

on:
  pull_request:
    paths:
      - "src/runtime/core_v1_*.py"
      - "src/runtime/runtime_entrypoint.py"
      - "src/execution/core_v1_finalized_settlement.py"
      - "src/production_debt_profiles.py"
      - "config/release_profiles/core-marginfi-jupiter-v1.json"
      - "scripts/verify_core_v1_closure.py"
      - "tests/test_core_v1_closure.py"
      - "docs/core-v1-closure.md"
      - ".github/workflows/core-v1-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Compile closure surfaces
        run: >-
          python -m compileall -q
          src/runtime/core_v1_composition.py
          src/runtime/core_v1_materializer.py
          src/runtime/runtime_entrypoint.py
          src/execution/core_v1_finalized_settlement.py
          src/production_debt_profiles.py
          scripts/verify_core_v1_closure.py
          tests/test_core_v1_closure.py
      - name: Format closure surfaces
        run: >-
          python -m black --check
          src/runtime/core_v1_composition.py
          src/runtime/core_v1_materializer.py
          src/runtime/runtime_entrypoint.py
          src/execution/core_v1_finalized_settlement.py
          src/production_debt_profiles.py
          scripts/verify_core_v1_closure.py
          tests/test_core_v1_closure.py
      - name: Focused core closure regressions
        run: >-
          python -m pytest -q
          tests/test_core_v1_closure.py
          tests/test_mpr2602_durable_completion.py
          tests/execution/test_mpr2610_finalized_economic_ledger.py
          tests/test_mpr2613_guarded_operations.py
          --disable-socket --allow-unix-socket
      - name: Verify core-v1 architecture and scoped debt
        run: python scripts/verify_core_v1_closure.py --json
