name: AGG-09 operational closure

on:
  pull_request:
    paths:
      - "src/operations/agg09_ops01.py"
      - "src/operations/agg09_ops02.py"
      - "src/operations/agg09_ops03.py"
      - "src/operations/mpr2614_continuous_conformance.py"
      - "src/operations/__init__.py"
      - "tests/test_agg09_ops01.py"
      - "tests/test_agg09_ops02.py"
      - "tests/test_agg09_ops03.py"
      - "tests/test_mpr2614_continuous_conformance.py"
      - "docs/agg/AGG-09.md"
      - "release_artifacts/agg/AGG-09/coverage.json"
      - ".github/workflows/agg-09-operational-closure.yml"

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"

jobs:
  focused:
    name: AGG-09 focused default-off gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Compile operational modules
        run: >-
          python -m compileall -q
          src/operations/agg09_ops01.py
          src/operations/agg09_ops02.py
          src/operations/agg09_ops03.py
          src/operations/mpr2614_continuous_conformance.py
      - name: Focused tests
        run: >-
          python -m pytest -q
          tests/test_agg09_ops01.py
          tests/test_agg09_ops02.py
          tests/test_mpr2614_continuous_conformance.py
          tests/test_agg09_ops03.py
          tests/test_mpr2613_guarded_operations.py
          tests/test_mpr2616_executable_ha_dr.py
          tests/test_mpr2618_credential_trust_rotation.py
          tests/security/test_mpr_td_04_security.py
          --disable-socket --allow-unix-socket
