name: Read-only qualification campaign
on:
  pull_request:
  push:
    branches: [main, 'codex/qpr-*']
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest tests/test_qpr*.py tests/test_native_cpmm_qualification.py tests/architecture/test_mpr_4x_02_runtime_authority.py --disable-socket --allow-unix-socket -q
