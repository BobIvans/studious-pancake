name: PR-353 final strategy closure

on:
  pull_request:
    paths:
      - "src/release_gate/pr353_strategy_closure.py"
      - "scripts/verify_pr353_strategy_closure.py"
      - "tests/test_pr353_strategy_closure.py"
      - "docs/qualification/FINAL_CURRENT_HEAD_RESIDUAL_MAP*"
      - "release_artifacts/final8/PR-353/**"
      - "scripts/verify_repo.py"
      - ".github/workflows/pr353-strategy-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr353:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Compile PR-353 surfaces
        run: >-
          python -m compileall -q
          src/release_gate/pr353_strategy_closure.py
          scripts/verify_pr353_strategy_closure.py
          tests/test_pr353_strategy_closure.py
      - name: Verify PR-353 current-head truth
        run: python scripts/verify_pr353_strategy_closure.py --json
      - name: Focused fail-closed regressions
        run: >-
          python -m pytest -q
          tests/test_pr353_strategy_closure.py
          tests/test_ultimate_mega1.py
          tests/test_mega8_dependency_closure.py
          --disable-socket --allow-unix-socket
      - name: Installed package audit import
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          from src.release_gate.pr353_strategy_closure import EXPECTED_STRATEGY_IDS
          assert len(EXPECTED_STRATEGY_IDS) == 73
          print("installed PR-353 audit import: ok")
          PY
