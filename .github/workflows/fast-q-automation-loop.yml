name: FAST-Q deterministic automation

on:
  pull_request:
    paths:
      - "src/fast_q_automation.py"
      - "src/automation_cli_pr189.py"
      - "tests/test_fast_q_automation.py"
      - "scripts/verify_fast_q_automation.py"
      - "config/fast_q_actions.json"
      - "docs/qualification/FAST_Q_AUTOMATION_RU.md"
      - "release_artifacts/fast_q_automation/**"
      - "scripts/verify_repo.py"
      - "config/format_targets.txt"
      - ".github/workflows/fast-q-automation-loop.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src/fast_q_automation.py src/automation_cli_pr189.py scripts/verify_fast_q_automation.py tests/test_fast_q_automation.py
      - name: Black
        run: python -m black --diff --check src/fast_q_automation.py src/automation_cli_pr189.py scripts/verify_fast_q_automation.py tests/test_fast_q_automation.py
      - name: Verify contract
        run: python scripts/verify_fast_q_automation.py
      - name: Focused tests
        run: python -m pytest -q tests/test_fast_q_automation.py tests/test_fast_q1_qualification_report.py --disable-socket --allow-unix-socket
      - name: Dependency consistency
        run: python -m pip check
      - name: Installed closed-loop smoke
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          out="$RUNNER_TEMP/fast-q-auto"
          request="$RUNNER_TEMP/qualify.json"
          result="$RUNNER_TEMP/qualify-result.json"
          cat > "$request" <<'JSON'
          {"schema_version":"fast-q2.action-request.v1","request_id":"smoke-auto","idempotency_key":"smoke-auto","action":"qualify_and_report","text":null,"inputs":{},"proposal":{"source":"model","action":"transcribe_local_audio"}}
          JSON
          flashloan-checks automation-request inspect \
            --request "$request" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-root "$out" \
            --expected-sha "$expected_sha" > "$result"
          python - "$result" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          details = payload["details"]
          assert details["live_authorized"] is False
          assert details["transactions_sent"] == 0
          assert details["paid_api_fallback"] is False
          assert details["proposal"]["advisory_only"] is True
          first = details["result"].get("first_blocker")
          print(json.dumps({"schema":"fast-q-automation.smoke.v1","status":details["status"],"first_blocker":first,"transactions_sent":0,"live_authorized":False}, sort_keys=True))
          PY
