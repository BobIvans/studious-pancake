name: MPR-NEXT-05 canary boundary

on:
  pull_request:
    paths:
      - src/live_boundary/mpr_next_05_canary_boundary.py
      - tests/test_mpr_next_05_canary_boundary.py
      - docs/roadmap/mpr_next_05_signer_jito_canary_boundary.md
      - .github/workflows/mpr-next-05-canary-boundary.yml

permissions:
  contents: read

jobs:
  canary-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Compile MPR-NEXT-05 boundary
        run: |
          python -m py_compile \
            src/live_boundary/mpr_next_05_canary_boundary.py \
            tests/test_mpr_next_05_canary_boundary.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mpr_next_05_canary_boundary.py
