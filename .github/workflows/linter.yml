name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -q --requirement requirements.txt
      - run: python -m pip install -q --requirement requirements-dev.txt
      - run: python -m pip install -q --no-deps .
      - name: Prime runner with files 001-050
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '1,50p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q >/tmp/first50.log
      - name: After prime test atomic sender-free execution
        run: python -m pytest tests/test_atomic_sender_free_execution.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test B1 provider protocol readiness
        run: python -m pytest tests/test_b1_provider_protocol_readiness.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test B2 Helius delivery plane
        run: python -m pytest tests/test_b2_helius_delivery_plane.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test D2 release soak artifacts
        run: python -m pytest tests/test_d2_release_soak_artifacts.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision calibration
        run: python -m pytest tests/test_decision_calibration.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision dataset
        run: python -m pytest tests/test_decision_dataset.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision isolation
        run: python -m pytest tests/test_decision_isolation.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision leakage
        run: python -m pytest tests/test_decision_leakage.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision model
        run: python -m pytest tests/test_decision_model.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: After prime test decision quota replay
        run: python -m pytest tests/test_decision_quota_replay.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
