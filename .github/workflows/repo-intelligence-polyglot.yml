name: Repo intelligence polyglot graph (OCA-W0B2)
on:
  pull_request:
    paths:
      - 'src/intelligence/repo_graph/**'
      - 'tests/intelligence/test_repo_graph*'
      - 'pyproject.toml'
      - '.github/workflows/repo-intelligence-polyglot.yml'
  push:
    branches:
      - main
    paths:
      - 'src/intelligence/repo_graph/**'
      - 'tests/intelligence/test_repo_graph*'
  schedule:
    - cron: '33 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polyglot-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - name: Gates
        run: |
          python -m black --check src/intelligence/repo_graph tests/intelligence/test_repo_graph.py tests/intelligence/test_repo_graph_polyglot.py
          python -m flake8 src/intelligence/repo_graph
          python -m mypy --follow-imports=silent --ignore-missing-imports src/intelligence/repo_graph
      - name: Contract tests with grammars installed
        run: python -m pytest -q tests/intelligence/test_repo_graph.py tests/intelligence/test_repo_graph_polyglot.py --disable-socket --allow-unix-socket
  grammar-absent-fallback:
    # Deterministic pipeline must stay explicit-PARTIAL (never crash, never
    # silently fall back) when the optional grammars are not installed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - name: Contract tests without tree-sitter grammars
        run: |
          python -m pip uninstall -y tree-sitter tree-sitter-bash tree-sitter-yaml tree-sitter-markdown
          python -m pytest -q tests/intelligence/test_repo_graph.py tests/intelligence/test_repo_graph_polyglot.py --disable-socket --allow-unix-socket
      - name: Determinism (two clean builds must be checksum-identical)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.intelligence.repo_graph.graph_build import build_graph
          a = build_graph(".", "artifacts/poly-a")
          b = build_graph(".", "artifacts/poly-b")
          assert a["canonical_checksum"] == b["canonical_checksum"]
          print("polyglot determinism OK:", a["canonical_checksum"][:16], a["counts"])
          PY
  nightly-polyglot-reconciliation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - name: Full rebuild reconciliation
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.intelligence.repo_graph.graph_build import build_graph
          full = build_graph(".", "artifacts/nightly-full")
          inc = build_graph(".", "artifacts/nightly-inc")
          assert full["canonical_checksum"] == inc["canonical_checksum"], "nightly drift"
          print("polyglot nightly reconciliation OK:", full["canonical_checksum"][:16])
          PY
