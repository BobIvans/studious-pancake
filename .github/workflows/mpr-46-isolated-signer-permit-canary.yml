name: MPR-46 isolated signer permit canary

on:
  pull_request:
    paths:
      - "src/mpr46_isolated_signer_canary.py"
      - "src/resources/mpr46_permit_canary_policy.json"
      - "scripts/verify_mpr46_isolated_signer_canary.py"
      - "tests/test_mpr46_isolated_signer_canary.py"
      - ".github/workflows/mpr-46-isolated-signer-permit-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-signer-permit-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_TRADING_ONLY: "true"
      LIVE_TRADING_ENABLED: "false"
      JITO_ENABLED: "false"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2
      - name: Compile MPR-46 surface
        run: |
          python -m py_compile \
            src/mpr46_isolated_signer_canary.py \
            scripts/verify_mpr46_isolated_signer_canary.py \
            tests/test_mpr46_isolated_signer_canary.py
      - name: Run focused MPR-46 tests
        run: python -m pytest -q tests/test_mpr46_isolated_signer_canary.py
      - name: Run fail-closed MPR-46 verifier
        run: python scripts/verify_mpr46_isolated_signer_canary.py --json > /tmp/mpr46-isolated-signer-canary.json
      - name: Assert verifier never enables live or returns signatures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/mpr46-isolated-signer-canary.json").read_text())
          assert payload["live_enabled"] is False
          assert payload["signature_material_returned"] is False
          assert payload["one_tx_canary_authorized"] is False
          assert payload["state"] == "BLOCKED"
          PY
