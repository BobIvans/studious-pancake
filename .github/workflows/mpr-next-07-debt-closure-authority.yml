name: MPR-NEXT-07 debt closure authority

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/readiness/**"
      - "src/resources/debt_closure_map_pr_next_07.json"
      - "scripts/archive_diff_sanity.py"
      - "scripts/verify_debt_closure_authority.py"
      - "tests/test_mpr_next_07_*.py"
      - "docs/roadmap/mpr_next_07_debt_closure_authority.md"
      - ".github/workflows/mpr-next-07-debt-closure-authority.yml"
  push:
    branches:
      - "mpr-next-07-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debt-closure-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # mpr-next-07-waive-moving-action: SHA pinning is handled by MPR-NEXT-13.
      - uses: actions/checkout@v4
      # mpr-next-07-waive-moving-action: SHA pinning is handled by MPR-NEXT-13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Compile debt closure slice
        run: >-
          python -m compileall -q
          src/readiness
          scripts/archive_diff_sanity.py
          scripts/verify_debt_closure_authority.py
          tests/test_mpr_next_07_debt_closure_authority.py
          tests/test_mpr_next_07_manifest_sync.py
      - name: Run focused MPR-NEXT-07 tests
        run: >-
          python -m pytest -q
          tests/test_mpr_next_07_debt_closure_authority.py
          tests/test_mpr_next_07_manifest_sync.py
      - name: Inspect static closure map
        run: python scripts/verify_debt_closure_authority.py --json
