name: wave15-inst01
on:
  pull_request:
    paths:
      - "src/research/wave15_institution.py"
      - "tests/research/test_wave15_inst01.py"
      - "scripts/verify_wave15_inst01.py"
      - "docs/roadmap/wave15-inst01-autonomous-market-institution.md"
      - ".github/workflows/wave15-inst01.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q src/research/wave15_institution.py scripts/verify_wave15_inst01.py tests/research/test_wave15_inst01.py
      - name: Verify bounded vertical
        run: python scripts/verify_wave15_inst01.py
      - name: Focused tests
        run: python -m pytest -q tests/research/test_wave15_inst01.py
