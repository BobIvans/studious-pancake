name: PR558 resolve main conflict

on:
  push:
    branches:
      - codex/mega-fastq-occ-laya-clean-20261002

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/mega-fastq-occ-laya-clean-20261002
          fetch-depth: 0

      - name: Merge current main and resolve only format target union
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-edit origin/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "config/format_targets.txt" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            python - <<'PY'
          from pathlib import Path
          import subprocess

          target = "config/format_targets.txt"
          ours = subprocess.check_output(["git", "show", f":2:{target}"], text=True)
          main = subprocess.check_output(["git", "show", f":3:{target}"], text=True)

          main_lines = main.splitlines()
          seen = set(main_lines)
          extras = [
              line
              for line in ours.splitlines()
              if line.strip() and not line.lstrip().startswith("#") and line not in seen
          ]

          merged = list(main_lines)
          if extras:
              if merged and merged[-1] != "":
                  merged.append("")
              merged.extend(extras)

          Path(target).write_text("\n".join(merged) + "\n", encoding="utf-8")
          PY

            git add config/format_targets.txt
            git commit --no-edit
          fi

          git push origin HEAD:codex/mega-fastq-occ-laya-clean-20261002
