name: SUPER-08 product and release closure

on:
  pull_request:
    paths:
      - "src/release_gate/agg15_release_handoff.py"
      - "src/research/product.py"
      - "config/agg14_research_coverage.json"
      - "scripts/verify_super08_product_release.py"
      - "tests/test_agg15_release_handoff.py"
      - "tests/test_super08_product_release.py"
      - "docs/agg/agg-15.md"
      - "docs/super/super-08.md"
      - ".github/workflows/super-08-product-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  super-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install locked development environment
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Installed SUPER-08 import boundary
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.release_gate.agg15_release_handoff
          import src.research.product
          print("installed SUPER-08 imports: ok")
          PY
      - name: Compile SUPER-08 surfaces
        run: >-
          python -m compileall -q
          src/release_gate/agg15_release_handoff.py
          scripts/verify_super08_product_release.py
          tests/test_agg15_release_handoff.py
          tests/test_super08_product_release.py
      - name: Format SUPER-08 surfaces
        run: >-
          python -m black --check
          src/release_gate/agg15_release_handoff.py
          scripts/verify_super08_product_release.py
          tests/test_agg15_release_handoff.py
          tests/test_super08_product_release.py
      - name: Product and release regressions
        run: >-
          python -m pytest -q
          tests/test_agg14_research_system.py
          tests/test_agg15_release_handoff.py
          tests/test_super08_product_release.py
          --disable-socket --allow-unix-socket
      - name: SUPER-08 structural verifier
        run: python scripts/verify_super08_product_release.py --json
