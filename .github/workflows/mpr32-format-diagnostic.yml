name: MPR-32 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  black-diff:
    name: Black diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact Black
        run: python -m pip install --quiet black==26.3.1
      - name: Show exact formatting diff
        run: >-
          python -m black --diff --check
          scripts/verify_mpr32_public_entrypoint_truth.py
          tests/test_mpr32_public_entrypoint_truth.py
