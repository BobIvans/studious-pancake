name: MEGA context Wave 3

on:
  pull_request:
    paths:
      - "src/mega_context_wave3.py"
      - "tests/test_mega_context_wave3.py"
      - "scripts/verify_mega_context_wave3.py"
      - "config/mega_context_wave3_status.json"
      - "config/mega_context_wave3_status.csv"
      - "config/mega_context_wave3_source_discrepancies.json"
      - "docs/roadmap/mega-context-wave3.md"
      - ".github/workflows/mega-context-wave3.yml"
      - "scripts/verify_repo.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q src/mega_context_wave3.py scripts/verify_mega_context_wave3.py tests/test_mega_context_wave3.py
      - name: Verify catalog and effect boundary
        run: python scripts/verify_mega_context_wave3.py
      - name: Focused acceptance
        run: python -m pytest -q tests/test_mega_context_wave3.py
