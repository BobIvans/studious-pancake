name: MPR-043 main sync

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  rebase-and-qualify:
    if: github.head_ref == 'mpr-043-dependency-entitlement-scheduler'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-043-dependency-entitlement-scheduler
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Rebase onto current main and requalify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m black --check \
            src/provider_governance \
            src/routing/registry.py \
            src/routing/registry.pyi \
            tests/test_mpr043_provider_governance.py
          python -m compileall -q src tests/test_mpr043_provider_governance.py
          python -m mypy --config-file mypy.ini
          python -m pytest -q \
            tests/test_mpr043_provider_governance.py \
            tests/routing/test_pr030_discovery_plane.py \
            tests/routing/test_pr030_quota_integration.py \
            tests/test_pr056_runtime_discovery.py \
            tests/test_mpr042_market_truth.py
          rm .github/workflows/mpr043-main-sync.yml
          git add -A
          git commit -m 'MPR-043: remove one-shot main sync workflow'
          git push --force-with-lease origin HEAD:mpr-043-dependency-entitlement-scheduler
