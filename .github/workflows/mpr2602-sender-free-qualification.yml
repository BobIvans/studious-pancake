name: MPR-2602 sender-free qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/paper_shadow/**"
      - "src/planning/**"
      - "src/execution/**"
      - "src/durability/**"
      - "src/economics/**"
      - "src/provider_governance/**"
      - "src/routing/**"
      - "tests/test_mpr2602*.py"
      - "tests/routing/test_mpr2602*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/mpr2602-sender-free-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpr2602-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  qualify:
    name: Offline Linux, identity, and wheel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
      - name: Record exact source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-checkout-sha.txt
          printf '%s\n' "$PR_HEAD_SHA" > evidence/pr-head-sha.txt
          git archive --format=tar.gz --output=evidence/tested-source.tar.gz HEAD
          python --version > evidence/python-version.txt
      - name: Install locked repository dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip freeze > evidence/environment.txt
      - name: Compile and fatal lint
        if: ${{ !cancelled() }}
        run: |
          python -m compileall -q src/paper_shadow src/planning src/execution src/routing src/provider_governance
          python -m flake8 src/paper_shadow/mpr2602_runtime.py src/paper_shadow/exact_attempt_pr152.py --select=E9,F63,F7,F82 --show-source --statistics 2>&1 | tee evidence/fatal-lint.txt
      - name: Prepared-path formatting
        if: ${{ !cancelled() }}
        run: |
          python -m black --check --diff src/paper_shadow/mpr2602_runtime.py src/paper_shadow/exact_attempt_pr152.py tests/test_mpr2602_plan_identity.py tests/test_mpr2602_prepared_exact_attempt.py 2>&1 | tee evidence/black.txt
      - name: Prepared-path typing
        if: ${{ !cancelled() }}
        run: |
          python -m mypy src/paper_shadow/mpr2602_runtime.py src/paper_shadow/exact_attempt_pr152.py 2>&1 | tee evidence/mypy.txt
      - name: Prepared-path security
        if: ${{ !cancelled() }}
        run: |
          python -m bandit -ll -ii src/paper_shadow/mpr2602_runtime.py src/paper_shadow/exact_attempt_pr152.py 2>&1 | tee evidence/bandit.txt
      - name: Offline plan, raw state, transport, capital, and installed A3 regressions
        if: ${{ !cancelled() }}
        run: |
          python -m pytest -q tests/test_mpr2602*.py tests/routing/test_mpr2602*.py tests/test_pr152_exact_sender_free_attempt.py tests/test_mega_pr_a3_installed_durable_paper_service.py --disable-socket --allow-unix-socket --junitxml=evidence/pytest.xml 2>&1 | tee evidence/pytest.txt
      - name: Rebuild and inspect wheel from tested tree
        if: ${{ !cancelled() }}
        run: |
          rm -rf build dist
          python -m build --wheel --no-isolation --outdir dist 2>&1 | tee evidence/wheel-build.txt
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one fresh wheel")
          wheel = wheels[0]
          required = {
              "src/paper_shadow/mpr2602_runtime.py",
              "src/paper_shadow/exact_attempt_pr152.py",
              "src/paper_shadow/durable_service_a3.py",
              "src/planning/atomic_marginfi_jupiter.py",
              "src/planning/instruction_firewall.py",
              "src/execution/state_evidence_pr115.py",
              "src/provider_governance/runtime.py",
              "src/routing/transport.py",
          }
          with ZipFile(wheel) as archive:
              missing = sorted(required - set(archive.namelist()))
              if missing:
                  raise SystemExit(f"missing wheel members: {missing}")
              for name in sorted(required):
                  if archive.read(name) != Path(name).read_bytes():
                      raise SystemExit(f"stale wheel member: {name}")
          report = {
              "wheel": wheel.name,
              "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "verified_source_members": sorted(required),
              "live_readiness_claimed": False,
          }
          Path("evidence/wheel-members.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Installed wheel and console smoke outside checkout
        if: ${{ !cancelled() }}
        run: |
          python scripts/package_smoke.py 2>&1 | tee evidence/package-smoke.txt
      - name: Preserve qualification evidence even when a gate fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpr2602-offline-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/
            dist/*.whl
          if-no-files-found: error
          retention-days: 14
