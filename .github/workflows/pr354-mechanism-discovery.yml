name: PR-354 mechanism discovery

on:
  pull_request:
    paths:
      - "src/mechanism_discovery/**"
      - "tests/mechanism_discovery/**"
      - "scripts/verify_pr354_mechanism_discovery.py"
      - "config/mechanism_discovery.json"
      - "docs/roadmap/pr354_non_duplication.md"
      - "docs/mechanism_discovery/**"
      - "release_artifacts/pr354/**"
      - ".github/workflows/pr354-mechanism-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .
      - name: Compile PR-354 surfaces
        run: >-
          python -m compileall -q
          src/mechanism_discovery
          scripts/verify_pr354_mechanism_discovery.py
          tests/mechanism_discovery
      - name: Structural verifier
        run: python scripts/verify_pr354_mechanism_discovery.py --json
      - name: Focused PR-354 tests
        run: >-
          python -m pytest -q
          tests/mechanism_discovery
          --disable-socket
          --allow-unix-socket
      - name: PR-353 canonical-owner regressions
        run: |
          python scripts/verify_pr353_strategy_evolution.py --json
          python -m pytest -q tests/strategy_evolution --disable-socket --allow-unix-socket
      - name: Assert default-off boundary
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("config/mechanism_discovery.json", encoding="utf-8"))
          assert len(payload["packages"]) == 12
          assert all(
              row["state"] == "DISABLED" and row["live"] is False
              for row in payload["packages"].values()
          )
          assert not any(payload["effect_boundary"].values())
          print("PR354_DEFAULT_OFF_OK")
          PY
