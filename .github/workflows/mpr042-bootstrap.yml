name: MPR-042 bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'mpr-042-watermarked-market-truth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-042-watermarked-market-truth
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Verify, apply and qualify MPR-042
        shell: bash
        run: |
          set -euo pipefail
          cat .mpr042/part-* | base64 --decode > /tmp/mpr042.tar.gz
          echo 'dff30beed0412a614674afc8ea0b2231e0e44a3c34caf3247e3438a3b8423691  /tmp/mpr042.tar.gz' | sha256sum --check -
          tar -xzf /tmp/mpr042.tar.gz
          python apply_mpr042.py
          sed -i 's/partition=f"leg:{leg}:{quote.provider}",/partition=f"leg:{leg}:{quote.provider}:{offset}",/' src/runtime_discovery_coordinator.py
          mv MPR-042.md docs/MPR-042_WATERMARKED_MARKET_TRUTH.md
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m black \
            src/market/__init__.py \
            src/market/observations.py \
            src/market/streams.py \
            src/market/cache.py \
            src/market/snapshots.py \
            src/runtime_discovery_models.py \
            src/runtime_discovery_coordinator.py \
            src/strategy/detectors.py \
            tests/test_mpr042_market_truth.py \
            tests/test_pr113_amount_coupled_discovery.py
          python -m compileall -q src tests/test_mpr042_market_truth.py
          python -m pytest -q \
            tests/test_mpr042_market_truth.py \
            tests/test_pr033_snapshot_detectors.py \
            tests/test_pr056_runtime_discovery.py \
            tests/test_pr113_amount_coupled_discovery.py
          rm -rf .mpr042 .github/workflows/mpr042-bootstrap.yml apply_mpr042.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MPR-042: watermarked market truth and coherent derived state'
          git push origin HEAD:mpr-042-watermarked-market-truth
