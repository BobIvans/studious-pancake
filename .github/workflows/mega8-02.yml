name: MEGA8-02 rights-aware graph and structural assets

on:
  pull_request:
    paths:
      - "src/mega8_02/**"
      - "tests/test_mega8_02_*.py"
      - "config/mega8_02_coverage.json"
      - "docs/roadmap/mega8-02.md"
      - ".github/workflows/mega8-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mega8-02:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Installed MEGA8-02 imports
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.mega8_02
          import src.mega8_02.pr163
          import src.mega8_02.pr176
          import src.mega8_02.pr185
          assert src.mega8_02.FUNCTION_COUNT == 92
          print("installed MEGA8-02 imports: ok")
          PY
      - name: Compile MEGA8-02 surfaces
        run: >-
          python -m compileall -q
          src/mega8_02
          tests/test_mega8_02_manifest.py
          tests/test_mega8_02_graph_solver.py
          tests/test_mega8_02_solana_assets.py
      - name: Format MEGA8-02 surfaces
        run: >-
          python -m black --diff --check
          src/mega8_02
          tests/test_mega8_02_manifest.py
          tests/test_mega8_02_graph_solver.py
          tests/test_mega8_02_solana_assets.py
      - name: Focused MEGA8-02 and canonical owner regressions
        run: >-
          python -m pytest -q
          tests/test_mega8_02_manifest.py
          tests/test_mega8_02_graph_solver.py
          tests/test_mega8_02_solana_assets.py
          tests/test_super03_venue_qualification.py
          tests/test_agg05_multihop_solver.py
          tests/test_agg05_conflict_scheduler.py
          tests/test_agg05_split_flow.py
          tests/test_agg01_financing_contracts.py
          --disable-socket --allow-unix-socket
      - name: Verify exact coverage and default-off boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/mega8_02_coverage.json").read_text())
          assert p["mega_id"] == "MEGA8-02"
          assert p["roadmap_children"] == list(range(163, 186))
          assert p["nf_range"] == [401, 492]
          assert len(p["children"]) == 23
          assert all(row["status"] == "IMPLEMENTED_OFFLINE" for row in p["children"])
          assert p["live_enabled"] is False
          assert p["signer_access"] is False
          assert p["network_access"] is False
          assert p["capital_mutation"] is False
          assert p["operational_status"] == "RESEARCH_ONLY"
          print("MEGA8-02 coverage/default-off evidence: ok")
          PY
