name: AGG-07 liquidation and lender expansion

on:
  pull_request:
    paths:
      - "src/liquidation/agg07.py"
      - "src/lending/agg07.py"
      - "tests/test_agg07_liquidation.py"
      - "tests/lending/test_agg07_lending.py"
      - "docs/agg/agg-07.md"
      - "release_artifacts/agg/agg-07/summary.json"
      - ".github/workflows/agg-07-liquidation-lenders-rate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agg-07:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked test environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Compile AGG-07 surfaces
        run: |
          python -m py_compile             src/liquidation/agg07.py             src/lending/agg07.py             tests/test_agg07_liquidation.py             tests/lending/test_agg07_lending.py
      - name: Format AGG-07 surfaces
        run: |
          python -m black --check             src/liquidation/agg07.py             src/lending/agg07.py             tests/test_agg07_liquidation.py             tests/lending/test_agg07_lending.py
      - name: Focused AGG-07 regressions
        env:
          PAPER_TRADING_ONLY: "true"
          LIVE_TRADING_ENABLED: "false"
          JITO_ENABLED: "false"
          KAMINO_LIQUIDATION_ENABLED: "false"
        run: |
          python -m pytest -q             tests/test_agg07_liquidation.py             tests/lending/test_agg07_lending.py             tests/test_mpr2619_liquidation_qualification.py             tests/lending/test_mpr2615_controlled_expansion.py             --disable-socket --allow-unix-socket
      - name: Assert evidence remains default-off
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("release_artifacts/agg/agg-07/summary.json").read_text()
          )
          assert payload["agg_id"] == "AGG-07"
          assert payload["live_enabled"] is False
          assert payload["sender_added"] is False
          assert payload["operational_status"] == "BLOCKED"
          assert len(payload["primary_nf"]) == 12
          print("AGG-07 default-off evidence: ok")
          PY
