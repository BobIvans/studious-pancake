name: SP-Q01 protocol admission

on:
  pull_request:
    paths:
      - "src/lending/sp_q01_protocol_admission.py"
      - "src/runtime/core_v1_dependency_resolver.py"
      - "tests/test_agg03_dependency_resolver.py"
      - "scripts/verify_sp_q01_protocol_admission.py"
      - "release_artifacts/sp_q01/**"
      - "config/format_targets.txt"
      - "scripts/verify_repo.py"
      - ".github/workflows/sp-q01-protocol-admission.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install repository dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src/lending/sp_q01_protocol_admission.py src/runtime/core_v1_dependency_resolver.py scripts/verify_sp_q01_protocol_admission.py tests/test_agg03_dependency_resolver.py
      - name: Black exact surfaces
        run: python -m black --diff --check src/lending/sp_q01_protocol_admission.py scripts/verify_sp_q01_protocol_admission.py src/runtime/core_v1_dependency_resolver.py tests/test_agg03_dependency_resolver.py
      - name: Verify admission boundary
        run: python scripts/verify_sp_q01_protocol_admission.py
      - name: Focused regression
        run: python -m pytest -q tests/test_agg03_dependency_resolver.py --disable-socket --allow-unix-socket
