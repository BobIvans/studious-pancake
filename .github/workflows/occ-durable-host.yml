name: OCC durable host integration

on:
  pull_request:
    paths:
      - "src/occ_durable_library.py"
      - "scripts/run_occ_native_host.py"
      - "scripts/verify_occ_durable_host.py"
      - "tests/test_occ_durable_host.py"
      - "scripts/run_qualification_task.py"
      - "tests/test_qualification_task_adapter.py"
      - "release_artifacts/occ_durable_host/**"
      - "docs/automation/OCC_DURABLE_HOST_INTEGRATION_RU.md"
      - "config/format_targets.txt"
      - "scripts/verify_repo.py"
      - ".github/workflows/occ-durable-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  occ-durable-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest==9.0.3 black==26.3.1
      - name: Compile OCC surfaces
        run: >-
          python -m compileall -q
          src/occ_durable_library.py
          scripts/run_occ_native_host.py
          scripts/verify_occ_durable_host.py
          tests/test_occ_durable_host.py
      - name: Check OCC formatting
        run: >-
          python -m black --diff --check
          src/occ_durable_library.py
          scripts/run_occ_native_host.py
          scripts/verify_occ_durable_host.py
          tests/test_occ_durable_host.py
      - name: Verify OCC durable host
        run: python scripts/verify_occ_durable_host.py
      - name: Focused regressions
        run: >-
          python -m pytest -q
          tests/test_occ_durable_host.py
          tests/test_qualification_task_adapter.py
