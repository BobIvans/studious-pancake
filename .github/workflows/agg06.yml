name: AGG-06 Solana venues

on:
  pull_request:
    paths:
      - "src/agg06_solana_venues.py"
      - "tests/test_agg06_solana_venues.py"
      - "docs/agg/AGG-06.md"
      - "release_artifacts/agg/AGG-06/coverage.json"
      - ".github/workflows/agg06.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agg06:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Materialize hash-locked dependency environment
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-dev.lock -d "$RUNNER_TEMP/wheelhouse"
          python -m pip install --no-index --require-hashes --find-links "$RUNNER_TEMP/wheelhouse" -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Compile and format AGG-06 surfaces
        run: |
          python -m compileall -q src/agg06_solana_venues.py tests/test_agg06_solana_venues.py
          python -m black --check --diff src/agg06_solana_venues.py tests/test_agg06_solana_venues.py
      - name: Focused AGG-06 regressions
        run: >-
          python -m pytest -q
          tests/test_agg06_solana_venues.py
          tests/test_mpr2617_direct_venue_capability.py
          tests/test_orderbook_amm_planner.py
          tests/test_mpr2621_lst_atomic_exit.py
          tests/strategies/stable_peg/test_mpr2622_stable_peg.py
          --disable-socket --allow-unix-socket
      - name: Sender-free source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/agg06_solana_venues.py").read_text(encoding="utf-8")
          forbidden = (
              "sendTransaction",
              "sendRawTransaction",
              "send_bundle",
              "Keypair(",
              "private_key",
              "aiohttp",
              "requests.",
          )
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit(f"forbidden AGG-06 effect surface: {found}")
          print("AGG-06 sender-free source guard: ok")
          PY
      - name: Installed wheel import boundary
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH python - <<'PY'
          import src.agg06_solana_venues as module
          manifest = module.coverage_manifest()
          assert manifest["live_enabled"] is False
          assert len(manifest["nf"]) == 15
          print("installed AGG-06 import: ok")
          PY
