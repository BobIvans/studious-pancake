name: Dynamic universe read-only evidence

on:
  pull_request:
    paths:
      - 'src/assets/**'
      - 'src/discovery/dynamic_universe/**'
      - 'src/strategy/relation_generators/**'
      - 'src/research/correlation_ledger/**'
      - 'src/economics/flash_capital_graph/**'
      - 'tests/test_dynamic_*.py'
      - 'tests/test_ton_radar_dynamic_universe.py'
      - '.github/workflows/dynamic-universe-read-only.yml'
  push:
    branches: ['codex/dynamic-universe-master-assignment-2026-10-07']

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      PAPER_TRADING_ONLY: 'true'
      LIVE_TRADING_ENABLED: 'false'
      JITO_ENABLED: 'false'
      KAMINO_LIQUIDATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Formatting
        run: >-
          python -m black --check src/assets src/discovery/dynamic_universe
          src/strategy/relation_generators src/research/correlation_ledger
          src/economics/flash_capital_graph tests/test_dynamic_*.py
          tests/test_ton_radar_dynamic_universe.py
      - name: Offline evidence and existing owner regressions
        run: >-
          python -m pytest tests/test_dynamic_*.py tests/test_ton_radar_dynamic_universe.py
          tests/test_shadow_arbitrage_graph.py tests/test_shadow_graph_review.py
          tests/test_pr117_asset_mint_registry.py tests/test_pr118_non_monotonic_sizing.py
          tests/test_agg05_multihop_solver.py tests/test_agg05_split_flow.py
          -q --disable-socket --allow-unix-socket
      - name: Undefined names
        run: >-
          python -m flake8 src/assets src/discovery/dynamic_universe
          src/strategy/relation_generators src/research/correlation_ledger
          src/economics/flash_capital_graph --select=E9,F63,F7,F82
      - name: Type check new owners
        run: >-
          python -m mypy --follow-imports=silent src/assets src/discovery/dynamic_universe
          src/strategy/relation_generators src/research/correlation_ledger
          src/economics/flash_capital_graph
