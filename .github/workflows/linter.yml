name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Offline tests 051-060
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '51,60p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 061-070
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '61,70p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 071-080
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '71,80p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 081-090
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '81,90p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Offline tests 091-100
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' -print | sort | sed -n '91,100p')
          python -m pytest "${files[@]}" -m "not live and not manual" --disable-socket --allow-unix-socket -q
