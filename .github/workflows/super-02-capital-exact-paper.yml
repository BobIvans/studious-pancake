name: SUPER-02 capital exact paper

on:
  pull_request:
    paths:
      - "src/lending/agg03_financing_ports.py"
      - "src/lending/financing_planner_adapter.py"
      - "src/lending/jupiter_lend.py"
      - "src/execution/agg03_financing_decoder.py"
      - "src/execution/financing_evidence.py"
      - "src/execution/economic_reconciliation/**"
      - "src/execution/state_evidence_pr115.py"
      - "src/planning/atomic_marginfi_jupiter.py"
      - "src/paper_shadow/atomic_vertical.py"
      - "src/paper_shadow/exact_attempt_pr152.py"
      - "src/runtime/core_v1_composition.py"
      - "src/runtime/core_v1_dependency_resolver.py"
      - "src/runtime/core_v1_materializer.py"
      - "src/runtime/runtime_entrypoint.py"
      - "src/production_debt_profiles.py"
      - "config/release_profiles/core-jupiter-lend-jupiter-v1.json"
      - "config/format_targets.txt"
      - "tests/execution/test_financing_reconciliation.py"
      - "tests/lending/test_agg03_financing_ports.py"
      - "tests/test_agg03_dependency_resolver.py"
      - "tests/test_agg03_installed_profile_selection.py"
      - "tests/test_agg01_financing_contracts.py"
      - "docs/super/SUPER-02.md"
      - "release_artifacts/super/SUPER-02/coverage.json"
      - ".github/workflows/super-02-capital-exact-paper.yml"

permissions:
  contents: read
  pull-requests: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"

jobs:
  focused:
    name: SUPER-02 canonical closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Compile canonical SUPER-02 surfaces
        run: >-
          python -m compileall -q
          src/lending/agg03_financing_ports.py
          src/lending/financing_planner_adapter.py
          src/lending/jupiter_lend.py
          src/execution/agg03_financing_decoder.py
          src/execution/financing_evidence.py
          src/execution/economic_reconciliation
          src/execution/state_evidence_pr115.py
          src/planning/atomic_marginfi_jupiter.py
          src/paper_shadow/atomic_vertical.py
          src/paper_shadow/exact_attempt_pr152.py
          src/runtime/core_v1_composition.py
          src/runtime/core_v1_dependency_resolver.py
          src/runtime/core_v1_materializer.py
          src/runtime/runtime_entrypoint.py
          src/production_debt_profiles.py
      - name: Black
        run: >-
          python -m black --diff --check
          src/lending/agg03_financing_ports.py
          src/lending/financing_planner_adapter.py
          src/lending/jupiter_lend.py
          src/execution/agg03_financing_decoder.py
          src/execution/financing_evidence.py
          src/execution/economic_reconciliation/models.py
          src/execution/economic_reconciliation/state.py
          src/execution/economic_reconciliation/engine.py
          src/execution/economic_reconciliation/exact_adapter.py
          src/execution/state_evidence_pr115.py
          src/planning/atomic_marginfi_jupiter.py
          src/paper_shadow/atomic_vertical.py
          src/paper_shadow/exact_attempt_pr152.py
          src/runtime/core_v1_composition.py
          src/runtime/core_v1_dependency_resolver.py
          src/runtime/core_v1_materializer.py
          src/runtime/runtime_entrypoint.py
          src/production_debt_profiles.py
          tests/execution/test_financing_reconciliation.py
          tests/lending/test_agg03_financing_ports.py
          tests/test_agg03_dependency_resolver.py
          tests/test_agg03_installed_profile_selection.py
          tests/test_agg01_financing_contracts.py
      - name: Focused canonical regressions
        run: >-
          python -m pytest -q
          tests/lending/test_agg03_financing_ports.py
          tests/execution/test_financing_reconciliation.py
          tests/test_agg03_dependency_resolver.py
          tests/test_agg03_installed_profile_selection.py
          tests/test_agg01_financing_contracts.py
          tests/test_pr034_atomic_marginfi_jupiter.py
          tests/test_pr058_atomic_vertical.py
          tests/test_core_v1_composition.py
          tests/test_pr131_account_lifecycle.py
          tests/test_pr152_exact_sender_free_attempt.py
          --disable-socket --allow-unix-socket
      - name: Coverage truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("release_artifacts/super/SUPER-02/coverage.json").read_text())
          assert p["source_packages"] == ["W2-03", "W2-04"]
          assert p["implementation_status"] == "PARTIAL"
          assert p["qualification_status"] == "BLOCKED_EXTERNAL"
          assert p["activation_status"] == "DISABLED"
          assert p["live_enabled"] is False
          assert "CORE_V1_FINANCING_RAW_DECODER_NOT_COMPOSED" in p["dependency_reconciliation"]["stale_blockers_retired"]
          assert "CORE_V1_PRIMARY_FINANCING_ROLE_REQUIRED_FOR_SLUMLORD_PROFILE" in p["dependency_reconciliation"]["stale_blockers_retired"]
          assert p["children"]["PR-094"] == "CODE_CLOSED_DEFAULT_OFF"
          assert p["children"]["PR-093"].startswith("PARTIAL")
          PY
      - name: Installed import smoke outside checkout
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import src.execution.agg03_financing_decoder
          import src.lending.agg03_financing_ports
          import src.lending.financing_planner_adapter
          import src.runtime.core_v1_dependency_resolver
          import src.runtime.core_v1_composition
          print("SUPER02_INSTALLED_IMPORT_OK")
          PY
