name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -q --requirement requirements.txt
      - run: python -m pip install -q --requirement requirements-dev.txt
      - run: python -m pip install -q --no-deps .
      - name: Test MPR-RP-03 instance resources
        run: python -m pytest tests/runtime/test_mpr_rp03_instance_resources.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test MPR-RP closure gate
        run: python -m pytest tests/runtime/test_mpr_rp_closure_gate.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test MPR-TD-04 policy validation
        run: python -m pytest tests/security/test_mpr_td_04_policy_validation.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test MPR-TD-04 security
        run: python -m pytest tests/security/test_mpr_td_04_security.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test PR009 signer artifact
        run: python -m pytest tests/security/test_pr009_signer_artifact.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test A2 exact attempt runtime
        run: python -m pytest tests/test_a2_exact_attempt_runtime.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test advanced components
        run: python -m pytest tests/test_advanced_components.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test AI trading system
        run: python -m pytest tests/test_ai_trading_system.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test AMM math dispatcher
        run: python -m pytest tests/test_amm_math_dispatcher.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
      - name: Test atomic sender-free execution
        run: python -m pytest tests/test_atomic_sender_free_execution.py -m "not live and not manual" --disable-socket --allow-unix-socket -q
