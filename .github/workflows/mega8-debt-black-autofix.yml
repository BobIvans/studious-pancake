name: MEGA8 debt temporary Black autofix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/release_gate/mega8_dependency_closure.py"
      - "tests/test_mega8_dependency_closure.py"
      - ".github/workflows/mega8-debt-black-autofix.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mega8-debt-black-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.13.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"

      - name: Install exact Black
        run: python -m pip install black==26.3.1

      - name: Format dependency closure paths
        run: |
          python -m black \
            src/release_gate/mega8_dependency_closure.py \
            tests/test_mega8_dependency_closure.py

      - name: Commit formatting if needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- \
            src/release_gate/mega8_dependency_closure.py \
            tests/test_mega8_dependency_closure.py; then
            echo "Black already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/release_gate/mega8_dependency_closure.py \
            tests/test_mega8_dependency_closure.py
          git commit -m "MEGA8 debt closure: apply Black 26.3.1 formatting"
          git push origin "HEAD:${HEAD_REF}"
