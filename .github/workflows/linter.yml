name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Test PR01 authority map
        if: always()
        run: python -m pytest tests/test_pr01_authority_map.py -q --disable-socket --allow-unix-socket
      - name: Test PR023 runtime truth
        if: always()
        run: python -m pytest tests/test_pr023_runtime_truth.py -q --disable-socket --allow-unix-socket
      - name: Test launcher startup smoke
        if: always()
        run: python -m pytest tests/test_launcher_startup_smoke.py -q --disable-socket --allow-unix-socket
      - name: Test import smoke
        if: always()
        run: python -m pytest tests/test_import_smoke.py -q --disable-socket --allow-unix-socket
      - name: Test quality quarantine
        if: always()
        run: python -m pytest tests/test_quality_quarantine.py -q --disable-socket --allow-unix-socket
      - name: Test PR087 package boundary
        if: always()
        run: python -m pytest tests/test_pr087_package_boundary.py -q --disable-socket --allow-unix-socket
      - name: Test PR101 MarginFi evidence
        if: always()
        run: python -m pytest tests/test_pr101_marginfi_complete_protocol_evidence.py -q --disable-socket --allow-unix-socket
      - name: Test PR106 sender lifecycle
        if: always()
        run: python -m pytest tests/test_pr106_canonical_sender_lifecycle_disabled.py -q --disable-socket --allow-unix-socket
      - name: Test PR115 simulation proof
        if: always()
        run: python -m pytest tests/test_pr115_simulation_owned_economic_proof.py -q --disable-socket --allow-unix-socket
      - name: Test PR116 MarginFi snapshot
        if: always()
        run: python -m pytest tests/test_pr116_coherent_marginfi_snapshot_oracle.py -q --disable-socket --allow-unix-socket
      - name: Test PR121 durable lifecycle
        if: always()
        run: python -m pytest tests/test_pr121_single_durable_lifecycle_truth.py -q --disable-socket --allow-unix-socket
      - name: Test PR120 secret resolver
        if: always()
        run: python -m pytest tests/test_pr120_secret_resolver_config_jito.py -q --disable-socket --allow-unix-socket
      - name: Test PR125 LST governance
        if: always()
        run: python -m pytest tests/test_pr125_lst_governance_policy.py -q --disable-socket --allow-unix-socket
      - name: Test PR136 rooted RPC quorum
        if: always()
        run: python -m pytest tests/test_pr136_rooted_rpc_quorum.py -q --disable-socket --allow-unix-socket
      - name: Test PR140 data lineage
        if: always()
        run: python -m pytest tests/test_pr140_data_lineage_quarantine.py -q --disable-socket --allow-unix-socket
      - name: Test PR194 trusted foundation
        if: always()
        run: python -m pytest tests/test_pr194_trusted_foundation.py -q --disable-socket --allow-unix-socket
      - name: Test PR195 durable webhook intake
        if: always()
        run: python -m pytest tests/test_pr195_durable_webhook_intake.py -q --disable-socket --allow-unix-socket
      - name: Test PR200 production cutover
        if: always()
        run: python -m pytest tests/test_pr200_production_cutover.py -q --disable-socket --allow-unix-socket
      - name: Test PR195 durable kernel v3
        if: always()
        run: python -m pytest tests/test_pr195_durable_kernel_v3.py -q --disable-socket --allow-unix-socket
      - name: Test PR206 durable state
        if: always()
        run: python -m pytest tests/test_pr206_durable_state.py -q --disable-socket --allow-unix-socket

  package-smoke:
    name: Wheel and console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/package_smoke.py

  container-smoke:
    name: Non-root runtime image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/image_smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
