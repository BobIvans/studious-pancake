name: AGG-01 temporary Black formatter

on:
  push:
    branches:
      - codex/agg-20260920-01

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/agg-20260920-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install exact formatter
        run: python -m pip install black==26.3.1
      - name: Format AGG-01 surfaces
        run: |
          python -m black \
            src/runtime/core_v1_materializer.py \
            src/runtime/core_v1_composition.py \
            src/execution/financing_evidence.py \
            src/lending/financing.py \
            src/release_gate/agg01_foundation.py \
            src/production_debt_profiles.py \
            src/qualification_pr176.py \
            tests/test_agg01_foundation.py \
            tests/test_agg01_financing_contracts.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/runtime/core_v1_materializer.py \
            src/runtime/core_v1_composition.py \
            src/execution/financing_evidence.py \
            src/lending/financing.py \
            src/release_gate/agg01_foundation.py \
            src/production_debt_profiles.py \
            src/qualification_pr176.py \
            tests/test_agg01_foundation.py \
            tests/test_agg01_financing_contracts.py
          git commit -m "AGG-01: apply Black 26.3.1 [skip ci]"
          git push origin HEAD:codex/agg-20260920-01
