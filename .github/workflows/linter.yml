name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"
  KAMINO_LIQUIDATION_ENABLED: "false"

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run quality gate
        run: python scripts/quality_gate.py --with-dependency-audit
      - name: Verify authority and packaging contracts
        run: |
          python scripts/validate_authority_map.py
          python scripts/package_smoke.py
          python scripts/verify_pr194_required_controls.py
          python scripts/verify_pr194_trusted_foundation.py --json
          python scripts/verify_mpr32_public_entrypoint_truth.py --json
          python scripts/verify_pr200_production_cutover.py --json
          python scripts/verify_pr206_durable_state.py --json
          python scripts/verify_mpr_td_01_canonical_surface.py --json
          python scripts/verify_mpr_td_02_failure_verification.py --json
          python scripts/verify_mpr_td_03_capacity_storage.py --json
          python scripts/verify_mpr_td_04_upgrade_security.py --json
      - name: Compile repository
        run: python -m compileall -q arb_bot.py src scripts tests
      - name: Verify status entrypoint
        run: python arb_bot.py status --json
      - name: Verify capabilities entrypoint
        run: python arb_bot.py capabilities --json
      - name: Run curated regression suite
        run: >-
          python -m pytest
          tests/test_pr01_authority_map.py
          tests/test_pr023_runtime_truth.py
          tests/test_launcher_startup_smoke.py
          tests/test_import_smoke.py
          tests/test_quality_quarantine.py
          tests/test_pr087_package_boundary.py
          tests/test_pr101_marginfi_complete_protocol_evidence.py
          tests/test_pr106_canonical_sender_lifecycle_disabled.py
          tests/test_pr115_simulation_owned_economic_proof.py
          tests/test_pr116_coherent_marginfi_snapshot_oracle.py
          tests/test_pr121_single_durable_lifecycle_truth.py
          tests/test_pr120_secret_resolver_config_jito.py
          tests/test_pr125_lst_governance_policy.py
          tests/test_pr136_rooted_rpc_quorum.py
          tests/test_pr140_data_lineage_quarantine.py
          tests/test_pr194_trusted_foundation.py
          tests/test_pr195_durable_webhook_intake.py
          tests/test_pr200_production_cutover.py
          tests/test_pr195_durable_kernel_v3.py
          tests/test_pr206_durable_state.py
          -q --disable-socket --allow-unix-socket
      - name: Run full offline test suite after curated suite
        run: >-
          python -m pytest -m "not live and not manual"
          --disable-socket --allow-unix-socket -q
      - name: Verify clean source tree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  package-smoke:
    name: Wheel and console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/package_smoke.py

  container-smoke:
    name: Non-root runtime image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/image_smoke.sh

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
