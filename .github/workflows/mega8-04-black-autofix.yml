name: MEGA8-04 temporary test Black autofix

on:
  push:
    branches:
      - codex/mega8-04-209-222

permissions:
  contents: write

jobs:
  black-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/mega8-04-209-222
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.3.1
      - run: python -m black tests/test_mega8_04.py
      - name: Commit formatting-only diff
        run: |
          if git diff --quiet -- tests/test_mega8_04.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mega8_04.py
          git commit -m "MEGA8-04: format final regression tests"
          git push origin HEAD:codex/mega8-04-209-222
