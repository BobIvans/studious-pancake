name: MPR-2612 final release gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/release_gate/**"
      - "tests/test_mpr31_final_promotion_gate.py"
      - "tests/test_mpr2612_durable_release.py"
      - "docs/mpr2612/**"
      - ".github/workflows/mpr-2612-final-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpr-2612-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIVE_TRADING_ENABLED: "false"
  PAPER_TRADING_ONLY: "true"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile final release surfaces
        run: |
          python -m compileall -q \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Format final release surfaces
        run: |
          python -m black --check --diff \
            src/release_gate/mpr31_final_promotion_gate.py \
            src/release_gate/mpr2612_durable_release.py \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Adversarial and durable release regressions
        run: |
          python -m pytest -q \
            tests/test_mpr31_final_promotion_gate.py \
            tests/test_mpr2612_durable_release.py
      - name: Prove release stays default-off
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/release_gate/mpr31_final_promotion_gate.py').read_text()
          durable = Path('src/release_gate/mpr2612_durable_release.py').read_text()
          assert 'TARGET_PRODUCT_STATE = "production-ready-default-off"' in source
          assert 'live_enabled=False' in source
          assert 'automatic_scale_up_allowed=False' in source
          assert 'CHECK(live_enabled=0)' in durable
          assert 'CHECK(unrestricted_live_allowed=0)' in durable
          assert 'CHECK(automatic_scale_up_allowed=0)' in durable
          print('MPR-2612 default-off release contract present')
          PY
