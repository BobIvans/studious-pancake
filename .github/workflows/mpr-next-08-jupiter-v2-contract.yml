name: MPR-NEXT-08 Jupiter V2 contract

on:
  pull_request:
    paths:
      - "config/format_targets.txt"
      - "config/jupiter_endpoint_quarantine.json"
      - "config/product_contract_pr195.json"
      - "docs/external_contracts.yaml"
      - "scripts/verify_mpr_next_08_jupiter_v2_contract.py"
      - "scripts/verify_repo.py"
      - "src/**"
      - "tests/test_mega_pr_b2_provider_conformance.py"
      - "tests/test_mpr_next_08_jupiter_v2_contract.py"
      - ".github/workflows/mpr-next-08-jupiter-v2-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jupiter-v2-contract:
    name: Jupiter V2 contract and quarantine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
      - name: Check MPR-NEXT-08 formatting
        run: >-
          python -m black --check
          scripts/verify_mpr_next_08_jupiter_v2_contract.py
          src/providers/conformance/mega_b2.py
          tests/test_mpr_next_08_jupiter_v2_contract.py
          tests/test_mega_pr_b2_provider_conformance.py
      - name: Verify Jupiter V2 product truth
        id: verify
        shell: bash
        run: |
          set +e
          python scripts/verify_mpr_next_08_jupiter_v2_contract.py --json > mpr-next-08-evidence.json
          status=$?
          cat mpr-next-08-evidence.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpr-next-08-evidence
          path: mpr-next-08-evidence.json
          if-no-files-found: error
      - name: Run Jupiter contract regression suites
        run: >-
          python -m pytest -q
          tests/test_mpr_next_08_jupiter_v2_contract.py
          tests/test_mega_pr_b2_provider_conformance.py
          --disable-socket
          --allow-unix-socket
      - name: Record production debt state
        run: python scripts/production_debt_audit.py --json > mpr-next-08-production-debt.json
      - name: Upload production debt state
        uses: actions/upload-artifact@v4
        with:
          name: mpr-next-08-production-debt
          path: mpr-next-08-production-debt.json
          if-no-files-found: error
