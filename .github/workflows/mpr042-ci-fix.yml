name: MPR-042 CI fixes

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'mpr-042-watermarked-market-truth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-042-watermarked-market-truth
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - name: Apply and qualify fixes
        shell: bash
        run: |
          set -euo pipefail
          python .mpr042-fix/apply.py
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m black \
            src/market/observations.py \
            src/market/streams.py \
            src/market/cache.py \
            src/runtime_discovery_coordinator.py \
            tests/test_mpr042_market_truth.py
          python -m mypy --config-file mypy.ini
          python -m pytest -q \
            tests/test_mpr042_market_truth.py \
            tests/test_pr033_snapshot_detectors.py \
            tests/test_pr056_runtime_discovery.py \
            tests/test_pr113_amount_coupled_discovery.py
          rm -rf .mpr042-fix .github/workflows/mpr042-ci-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MPR-042: fix typing, restart backfill and slot-skew authority'
          git push origin HEAD:mpr-042-watermarked-market-truth
