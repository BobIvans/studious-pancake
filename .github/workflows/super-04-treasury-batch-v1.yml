name: SUPER-04 treasury batch v1

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/economics/treasury_replenishment.py"
      - "src/execution/alt_lifecycle.py"
      - "src/execution/transaction_format_qualification.py"
      - "src/planning/intent_batch.py"
      - "tests/test_super04_treasury_replenishment.py"
      - "tests/execution/test_super04_alt_lifecycle.py"
      - "tests/execution/test_super04_transaction_format_qualification.py"
      - "tests/test_super04_intent_batch.py"
      - "docs/super/SUPER-04.md"
      - "release_artifacts/super/SUPER-04/coverage.json"
      - ".github/workflows/super-04-treasury-batch-v1.yml"

permissions:
  contents: read

env:
  PAPER_TRADING_ONLY: "true"
  LIVE_TRADING_ENABLED: "false"
  JITO_ENABLED: "false"

jobs:
  focused:
    name: SUPER-04 focused default-off gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --no-deps .
      - name: Compile SUPER-04 modules
        run: >-
          python -m compileall -q
          src/economics/treasury_replenishment.py
          src/execution/alt_lifecycle.py
          src/execution/transaction_format_qualification.py
          src/planning/intent_batch.py
      - name: Focused tests
        run: >-
          python -m pytest -q
          tests/test_super04_treasury_replenishment.py
          tests/execution/test_super04_alt_lifecycle.py
          tests/execution/test_super04_transaction_format_qualification.py
          tests/test_super04_intent_batch.py
          --disable-socket --allow-unix-socket
      - name: Installed imports outside checkout
        run: >-
          cd "$RUNNER_TEMP" &&
          python -c "from src.economics.treasury_replenishment import plan_fee_reserve_replenishment; from src.execution.alt_lifecycle import plan_owned_alt_preparation; from src.execution.transaction_format_qualification import assess_transaction_format; from src.planning.intent_batch import admit_atomic_intent_batch; print('SUPER-04 installed imports OK')"
      - name: Coverage assertions
        run: >-
          python -c "import json; p=json.load(open('release_artifacts/super/SUPER-04/coverage.json')); assert p['source_prs']==['PR-073','PR-076','PR-074','PR-078']; assert len(p['primary_nf_ids'])==16; assert len(set(p['primary_nf_ids']))==16; assert p['implementation_status']=='PARTIAL'; assert p['children']['PR-078']['status']=='BLOCKED'; assert not p['live_enabled'] and not p['signing_enabled'] and not p['submission_enabled']"
