name: SUPER-01 Black diagnostic

on:
  pull_request:
    paths:
      - "src/agg02/transaction_formats.py"
      - "src/agg02/historical_membership.py"
      - "tests/test_super01_transaction_formats.py"
      - ".github/workflows/super01-black-diagnostic.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install black==26.3.1
      - name: Show exact Black diff
        run: |
          python -m black --diff --check             src/agg02/transaction_formats.py             src/agg02/historical_membership.py             tests/test_super01_transaction_formats.py
