name: AGG-13 non-atomic inventory

on:
  pull_request:
    paths:
      - "src/data_plane/external_datasets.py"
      - "src/inventory/**"
      - "tests/test_agg13_*.py"
      - "docs/agg/agg-13.md"
      - ".github/workflows/agg-13-non-atomic-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install locked dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps .
      - name: Syntax and import boundary
        run: |
          python -m compileall -q src/data_plane/external_datasets.py src/inventory tests/test_agg13_external_datasets.py tests/test_agg13_inventory_platform.py
          python -m flake8 src/data_plane/external_datasets.py src/inventory tests/test_agg13_external_datasets.py tests/test_agg13_inventory_platform.py --select=E9,F63,F7,F82 --show-source --statistics
      - name: Focused offline tests
        env:
          PAPER_TRADING_ONLY: "true"
          LIVE_TRADING_ENABLED: "false"
          JITO_ENABLED: "false"
          KAMINO_LIQUIDATION_ENABLED: "false"
        run: |
          python -m pytest -q --disable-socket --allow-unix-socket tests/test_agg13_external_datasets.py tests/test_agg13_inventory_platform.py
