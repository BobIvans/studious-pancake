name: MPR-043 dependency lock refresh

on:
  push:
    branches:
      - mpr-043-dependency-entitlement-scheduler
    paths:
      - .github/workflows/mpr043-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-043-dependency-entitlement-scheduler
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.13"

      - name: Install lock compiler
        run: python -m pip install pip-tools==7.5.2

      - name: Rebuild hashed locks
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --output-file=requirements.lock \
            --strip-extras \
            requirements.txt
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --output-file=requirements-dev.lock \
            --strip-extras \
            requirements-dev.txt

      - name: Refresh lock manifest digests
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("config/requirements-lock.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def digest(name: str) -> str:
              return hashlib.sha256(Path(name).read_bytes()).hexdigest()

          data["locks"]["requirements.txt"]["sha256"] = digest("requirements.txt")
          data["locks"]["requirements-dev.txt"]["sha256"] = digest("requirements-dev.txt")
          data["resolved_locks"]["requirements.lock"]["sha256"] = digest("requirements.lock")
          data["resolved_locks"]["requirements-dev.lock"]["sha256"] = digest("requirements-dev.lock")
          data["resolver"] = {"name": "pip-tools", "version": "7.5.2"}
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Commit regenerated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock config/requirements-lock.json
          git diff --cached --check
          git commit -m "fix(deps): refresh hashed dependency locks"
          git push origin HEAD:mpr-043-dependency-entitlement-scheduler
