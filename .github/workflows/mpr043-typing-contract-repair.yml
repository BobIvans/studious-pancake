name: MPR-043 typing contract repair

on:
  push:
    branches:
      - mpr-043-dependency-entitlement-scheduler
    paths:
      - .github/workflows/mpr043-typing-contract-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mpr-043-dependency-entitlement-scheduler
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .

      - name: Apply runtime contract and fairness repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path("src/routing/registry.py")
          text = registry_path.read_text(encoding="utf-8")
          text = text.replace("from typing import Any, Mapping\n", "from typing import Any, Mapping, Protocol\n")
          text = text.replace("from .adapters import ProviderAdapter\n", "")

          marker = "from .transport import Transport\n\n"
          protocol = '''from .transport import Transport


class DiscoveryProvider(Protocol):
    """Runtime structural contract for discovery-capable provider adapters."""

    provider_id: str
    capabilities: Any
    circuit: Any

    def startup_state(self) -> dict[str, str]: ...

    def status(self) -> Any: ...

    async def request_quote(self, request: QuoteRequest) -> NormalizedQuote: ...

'''
          if "class DiscoveryProvider(Protocol):" not in text:
              if marker not in text:
                  raise SystemExit("transport import marker not found")
              text = text.replace(marker, protocol, 1)

          text = text.replace("adapter: ProviderAdapter", "adapter: DiscoveryProvider")
          text = text.replace("tuple[ProviderAdapter, ...]", "tuple[DiscoveryProvider, ...]")
          text = text.replace("                adapter.quota = quota\n", "                setattr(adapter, \"quota\", quota)\n")

          old_quota = '''            if (
                adapter.provider_id == "jupiter_router"
                and exc.status_code == 429
                and getattr(adapter, "quota", None) is not None
            ):
                adapter.quota.record_http_429()
'''
          new_quota = '''            if adapter.provider_id == "jupiter_router" and exc.status_code == 429:
                quota = getattr(adapter, "quota", None)
                if quota is not None:
                    quota.record_http_429()
'''
          if old_quota in text:
              text = text.replace(old_quota, new_quota, 1)
          elif new_quota not in text:
              raise SystemExit("HTTP 429 quota block not found")
          registry_path.write_text(text, encoding="utf-8")

          scheduler_path = Path("src/provider_governance/scheduler.py")
          scheduler = scheduler_path.read_text(encoding="utf-8")
          start = scheduler.index("    async def _dispatch_locked(self) -> None:\n")
          end = scheduler.index("    async def acquire(\n", start)
          dispatch = '''    async def _dispatch_locked(self) -> None:
        """Dispatch at most one state-changing item per condition turn.

        The next caller re-ranks the remaining queue after `_served` changes.
        Granting a whole sorted snapshot before awakened tasks can run would
        preserve lease order but violate observable operation-start fairness.
        """

        now = self.clock()
        self._expire_pending_locked(now)
        for item in sorted(
            tuple(self._pending),
            key=lambda queued: self._sort_key(queued, now),
        ):
            if item.future.done() or item not in self._pending:
                continue
            try:
                manifest = self.authority.entitlement(item.request.provider_id)
                await self.dependencies.assert_admissible(
                    item.request.provider_id,
                    manifest.generation,
                    item.request.operation,
                )
                lease = await self.authority.reserve(item.request)
            except ProviderAdmissionError as exc:
                if exc.retryable and (
                    exc.retry_at is None or exc.retry_at < item.request.deadline_at
                ):
                    continue
                self._pending.remove(item)
                self._denied += 1
                item.future.set_exception(exc)
                return
            self._pending.remove(item)
            self._served[item.request.fairness_key] += 1
            self._grant_order.append(item.request.work_id)
            self._granted += 1
            item.future.set_result(lease)
            return

'''
          scheduler = scheduler[:start] + dispatch + scheduler[end:]
          scheduler_path.write_text(scheduler, encoding="utf-8")
          PY
          python -m black src/routing/registry.py src/provider_governance/scheduler.py

      - name: Verify repaired contract and scheduler
        run: |
          python -m compileall -q src/provider_governance src/routing/registry.py
          python -m black --check src/provider_governance src/routing/registry.py tests/test_mpr043_provider_governance.py tests/test_mpr_sys_03_review_regressions.py
          python -m mypy src/provider_governance src/routing/registry.py
          python -m pytest -q \
            tests/test_mpr043_provider_governance.py \
            tests/test_mpr_sys_03_review_regressions.py \
            tests/test_pr208_runtime_adapter_governance.py \
            tests/test_routing_registry.py \
            tests/routing/test_mpr041_canonical_semantics.py \
            tests/test_pr056_runtime_discovery.py \
            --disable-socket --allow-unix-socket

      - name: Commit clean repair
        run: |
          rm .github/workflows/mpr043-typing-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routing/registry.py src/provider_governance/scheduler.py .github/workflows/mpr043-typing-contract-repair.yml
          git commit -m "fix: enforce observable fair provider dispatch"
          git push origin HEAD:mpr-043-dependency-entitlement-scheduler
