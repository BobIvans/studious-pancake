name: MPR-SYS-03 provider governance

on:
  pull_request:
    paths:
      - "src/provider_governance/**"
      - "src/routing/registry.py"
      - "src/routing/registry.pyi"
      - "tests/test_mpr043_provider_governance.py"
      - "tests/test_mpr_sys_03_review_regressions.py"
      - "docs/MPR-043_DEPENDENCY_ENTITLEMENT_SCHEDULER.md"
      - "config/format_targets.txt"
      - ".github/workflows/mpr043-final-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps .

      - name: Compile provider-governance surface
        run: |
          python -m compileall -q \
            src/provider_governance \
            src/routing/registry.py \
            tests/test_mpr043_provider_governance.py \
            tests/test_mpr_sys_03_review_regressions.py

      - name: Check formatting
        run: |
          python -m black --check --diff \
            src/provider_governance \
            src/routing/registry.py \
            tests/test_mpr043_provider_governance.py \
            tests/test_mpr_sys_03_review_regressions.py

      - name: Check focused typing
        run: |
          python -m mypy \
            src/provider_governance \
            src/routing/registry.py

      - name: Run provider-governance regression tests
        env:
          PAPER_TRADING_ONLY: "true"
          LIVE_TRADING_ENABLED: "false"
          JITO_ENABLED: "false"
        run: |
          python -m pytest -q \
            tests/test_mpr043_provider_governance.py \
            tests/test_mpr_sys_03_review_regressions.py \
            tests/routing/test_mpr041_canonical_semantics.py \
            tests/test_pr056_runtime_discovery.py \
            --disable-socket --allow-unix-socket
