name: MPR-2611 production qualification

on:
  pull_request:
    paths:
      - "src/production_qualification.py"
      - "src/qualification_pr176.py"
      - "scripts/qualify_release.py"
      - "scripts/verify_mpr2611_production_qualification.py"
      - "scripts/run_mpr2611_clean_qualification.py"
      - "config/mpr2611_qualification_authority.json"
      - "tests/test_mpr2611_production_qualification.py"
      - "tests/test_mpr2611_qualification_authority.py"
      - ".github/workflows/mpr-2611-production-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Compile MPR-2611 surfaces
        run: >-
          python -m compileall -q
          src/production_qualification.py
          src/qualification_pr176.py
          scripts/qualify_release.py
          scripts/verify_mpr2611_production_qualification.py
          scripts/run_mpr2611_clean_qualification.py
          tests/test_mpr2611_production_qualification.py
          tests/test_mpr2611_qualification_authority.py
      - name: Focused qualification regressions
        run: >-
          python -m pytest -q
          tests/test_pr176_hermetic_qualification.py
          tests/test_mpr2611_production_qualification.py
          tests/test_mpr2611_qualification_authority.py
      - name: Verify qualification authority
        run: python scripts/verify_mpr2611_production_qualification.py
      - name: Recompute qualification twice
        run: >-
          python scripts/run_mpr2611_clean_qualification.py
          --release-id mpr2611-ci
          --source-commit "$GITHUB_SHA"
          --repeat 2
          --output .runtime/mpr2611-repeated.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpr2611-repeated-qualification
          path: .runtime/mpr2611-repeated.json
          if-no-files-found: error
          retention-days: 14
