name: MPR-2609 format probe

on:
  push:
    branches:
      - codex/mpr-2609-limited-live-canary

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.13'
      - run: python -m pip install black==26.3.1
      - name: Exact Black diff
        run: python -m black --diff --check src/live_canary/mpr2609.py
